<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Literata:opsz,wght@7..72,600;7..72,700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#F2F4F6;--ink:#191F28;--ink2:#333D4B;--soft:#8B95A1;--line:#E5E8EB;--fill:#F2F4F6;--card:#FFFFFF;--accent:#3182F6;--accentSoft:#E8F3FF;--ok:#03B26C;--okSoft:#E5F8EF;--bad:#F04452;--badSoft:#FFEBEE;--mark:#FFF3B0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101013;--ink:#F2F4F6;--ink2:#D1D6DB;--soft:#8B95A1;--line:#2B2B30;--fill:#26262B;--card:#1C1C20;--accent:#4C93FF;--accentSoft:#1B2A45;--ok:#2BD08A;--okSoft:#13302A;--bad:#FF6170;--badSoft:#3A1C22;--mark:#5A4E12}}
:root[data-theme="dark"]{--bg:#101013;--ink:#F2F4F6;--ink2:#D1D6DB;--soft:#8B95A1;--line:#2B2B30;--fill:#26262B;--card:#1C1C20;--accent:#4C93FF;--accentSoft:#1B2A45;--ok:#2BD08A;--okSoft:#13302A;--bad:#FF6170;--badSoft:#3A1C22;--mark:#5A4E12}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif;line-height:1.5;font-size:19px;-webkit-text-size-adjust:100%;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:820px;margin:0 auto;padding:28px 24px 72px}
h1{font-size:1.85rem;font-weight:700;margin:8px 4px 2px;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.sub{color:var(--soft);font-size:.9rem;margin:0 4px 16px}
.term{font-weight:700;letter-spacing:-.005em}
.tabs{display:flex;gap:2px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--line);padding:4px;border-radius:12px;z-index:5;margin-bottom:12px;box-shadow:0 0 0 8px var(--bg)}
.tabs button{flex:1;padding:12px 0;border:none;background:transparent;color:var(--soft);font:inherit;font-size:1rem;font-weight:600;border-radius:9px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.chip{padding:9px 16px;border-radius:999px;border:none;background:var(--card);color:var(--ink2);font:inherit;font-size:.95rem;font-weight:500;cursor:pointer}
.chip.on{background:var(--ink);color:var(--card)}
.chip.wr.on{background:var(--bad);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.count{font-size:.92rem;color:var(--soft);margin:4px 4px 8px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:18px;overflow:hidden}
td{padding:16px 22px;border-bottom:1px solid var(--line);vertical-align:top;font-size:1.08rem}
tr:last-child td{border-bottom:none}
td.p{width:45%;word-break:break-word;color:var(--ink)}
td.k{color:var(--ink2)}
td .en{display:block;color:var(--soft);font-size:.8rem;margin-top:2px}
td .w{color:var(--bad);font-size:.72rem;font-weight:600;margin-left:6px}
.hide-ko td.k .ko{background:var(--fill);color:transparent;border-radius:6px;cursor:pointer}
.hide-ko td.k .ko.show{background:none;color:inherit}
.search,.spell{width:100%;padding:17px 18px;border:none;border-radius:14px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:10px;box-shadow:inset 0 0 0 1px var(--line)}
.search:focus,.spell:focus{box-shadow:inset 0 0 0 2px var(--accent);outline:none}
.spell{font-size:1.35rem;font-weight:600;background:var(--fill);box-shadow:none}
.row{display:flex;gap:8px;align-items:center;margin:0 4px 10px;flex-wrap:wrap}
.row label{font-size:.9rem;color:var(--ink2);display:flex;gap:8px;align-items:center}
.q .row{margin-left:0}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:18px;height:18px}
.flash{background:var(--card);border-radius:24px;min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 24px;text-align:center;cursor:pointer;user-select:none}
.flash .big{font-size:2.7rem;word-break:break-word;letter-spacing:-.02em}
.flash .ans{margin-top:18px;font-size:1.7rem;font-weight:600;color:var(--accent)}
.flash .ans mark{background:none;color:inherit;padding:0}
.flash .en{color:var(--soft);font-size:.9rem;margin-top:4px}
.flash .hint{color:var(--soft);font-size:.82rem;margin-top:18px}
.btns{display:flex;gap:8px;margin-top:12px}
.btns button,.primary{flex:1;padding:18px;border-radius:16px;border:none;font:inherit;font-size:1.08rem;font-weight:600;cursor:pointer}
.no{background:var(--fill);color:var(--ink2)}
.q .no{background:var(--fill)}
.flash~.btns .no{background:var(--card)}
.yes{background:var(--accent);color:#fff}
.primary{background:var(--accent);color:#fff;width:100%}
.primary.alt{background:var(--accentSoft);color:var(--accent)}
.q{background:var(--card);border-radius:24px;padding:32px 28px}
.q .prog{font-size:.92rem;color:var(--soft);display:flex;justify-content:space-between;gap:8px;font-weight:500}
.bar{height:4px;background:var(--fill);border-radius:99px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.q .ask{font-size:2.2rem;font-weight:700;margin:28px 0 28px;word-break:break-word;letter-spacing:-.02em}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:19px 20px;font-size:1.15rem;font-weight:500;margin-bottom:10px;border:none;border-radius:16px;background:var(--fill);color:var(--ink);font-family:inherit;cursor:pointer;box-shadow:inset 0 0 0 1.5px transparent}
.opt .n{flex:none;width:30px;height:30px;border-radius:8px;background:var(--card);color:var(--soft);font-size:.9rem;font-weight:700;display:grid;place-items:center}
.opt.sel{background:var(--accentSoft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.opt.sel .n{background:var(--accent);color:#fff}
.opt.right{background:var(--okSoft);box-shadow:inset 0 0 0 1.5px var(--ok)}
.opt.right .n{background:var(--ok);color:#fff}
.opt.wrong{background:var(--badSoft);box-shadow:inset 0 0 0 1.5px var(--bad)}
.opt.wrong .n{background:var(--bad);color:#fff}
.opt>span:nth-child(2){flex:1;min-width:0}
.opt .ex{margin-left:auto;text-align:right;max-width:50%;color:var(--ink2);font-size:.92rem;line-height:1.3;padding-left:14px;border-left:1.5px solid var(--line)}
.opt .ex b{display:block;font-weight:700}
.opt .ex small{display:block;color:var(--soft);font-size:.78rem;font-weight:400;margin-top:2px}
.opt.right .ex{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.opt.wrong .ex{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
@media (max-width:520px){.opt{flex-wrap:wrap}.opt .ex{max-width:none;width:100%;text-align:left;margin:6px 0 0 44px;padding:6px 0 0;border-left:none;border-top:1.5px solid var(--line)}}
@media (prefers-reduced-motion:no-preference){
 .enter{animation:qin .32s cubic-bezier(.2,.8,.2,1) both}
 .leave{animation:qout .17s ease-in both;pointer-events:none}
 .flip{animation:flip .28s cubic-bezier(.2,.8,.2,1) both}
 .opt .ex{animation:exin .3s cubic-bezier(.2,.8,.2,1) both}
 .opt.wrong{animation:shake .32s ease}
 .opt.right .n{animation:pop .3s ease}
 .q.enter .opt{animation:optin .34s cubic-bezier(.2,.8,.2,1) both}
 .q.enter .opt:nth-of-type(2){animation-delay:.04s}.q.enter .opt:nth-of-type(3){animation-delay:.08s}.q.enter .opt:nth-of-type(4){animation-delay:.12s}
 .bar i{transition:width .4s cubic-bezier(.2,.8,.2,1)}
}
@keyframes qin{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes qout{to{opacity:0;transform:translateX(-36px)}}
@keyframes flip{from{opacity:.4;transform:rotateY(70deg) scale(.97)}to{opacity:1;transform:none}}
@keyframes exin{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
@keyframes optin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1)}}
.keys{font-size:.85rem;color:var(--soft);text-align:center;margin-top:10px}
.keys kbd{font-family:inherit;background:var(--fill);border-radius:5px;padding:1px 6px;margin:0 1px}
.fb{padding:14px 16px;font-size:1.1rem;border-radius:12px;margin:10px 0;font-weight:600}
.fb.ok{background:var(--okSoft);color:var(--ok)}
.fb.bad{background:var(--badSoft);color:var(--bad)}
.score{font-size:3.6rem;font-weight:800;text-align:center;margin:4px 0 8px;color:var(--accent);letter-spacing:-.03em}
.score small{font-size:1rem;color:var(--soft);font-weight:500;letter-spacing:0}
.wrongs{padding-left:18px;color:var(--ink2)}
.wrongs li{margin-bottom:6px}
.note{font-size:.92rem;color:var(--soft)}
select{font:inherit;padding:6px 10px;background:var(--fill);color:var(--ink);border:none;border-radius:8px}
@media (prefers-reduced-motion:no-preference){.flash,.opt,.chip,.btns button,.primary,.tabs button{transition:transform .1s,background .15s,box-shadow .15s}.flash:active,.opt:active,.btns button:active,.primary:active{transform:scale(.98)}}

.chip em{font-style:normal;opacity:.55;font-size:.85em;margin-left:2px}
.chip.on em{opacity:.7}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.toolbar .search{flex:1;min-width:220px;margin:0}
.seg{display:inline-flex;background:var(--fill);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.q .seg,.cardtop .seg{background:var(--fill)}
.toolbar .seg{background:var(--card)}
.seg button{border:none;background:transparent;color:var(--soft);font:inherit;font-size:.92rem;font-weight:600;padding:8px 14px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.toolbar .seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.lbl{font-size:.92rem;color:var(--soft);font-weight:600;min-width:56px}
.ttl{font-size:1.3rem;font-weight:700;margin:0 0 14px}
.gap{height:10px}
.sm{font-size:.8em;opacity:.75;font-weight:500}
.link{border:none;background:none;color:var(--accent);font:inherit;font-size:inherit;font-weight:600;cursor:pointer;padding:0}
.count{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{display:inline-block;font-size:.72rem;color:var(--soft);background:var(--fill);border-radius:6px;padding:1px 7px;margin-left:8px;font-weight:600;vertical-align:middle}
td .tag{display:block;width:max-content;margin:6px 0 0}
.hide-ko td.k .hv,.hide-en td.p .hv{background:var(--fill);color:transparent;border-radius:6px;cursor:pointer}
.hide-ko tr.show td.k .hv,.hide-en tr.show td.p .hv{background:none;color:inherit}
.hide-ko td.k .en,.hide-en td.k .en{visibility:hidden}
.hide-ko tr.show td.k .en,.hide-en tr.show td.k .en{visibility:visible}
tbody tr{cursor:pointer}
.cardtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.flash{position:relative}
.ftag{position:absolute;top:16px;left:16px;margin:0}
.qtag{font-size:.82rem;color:var(--soft);margin-top:14px;font-weight:600}
.qtag+.ask{margin-top:8px}
.okc{color:var(--ok)}.badc{color:var(--bad)}
.hintw{letter-spacing:.08em;color:var(--ink)}
.verdict{text-align:center;color:var(--ink2);margin:0 0 18px}
.chs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.chs div{background:var(--fill);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;row-gap:6px;font-size:.92rem}
.chs b{font-size:1.1rem}
.chs i{grid-column:1/-1;height:5px;border-radius:9px;background:linear-gradient(90deg,var(--accent) var(--w),var(--line) var(--w))}
.chs small{grid-column:1/-1;color:var(--soft)}
.wl{display:grid;gap:8px}
.wl div{background:var(--fill);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 12px}
.wl small{grid-column:1/-1;color:var(--bad);font-size:.84rem}
.btns #hint{flex:.6}

.mocktab[aria-pressed="false"]{color:var(--accent)!important}
.xtypes{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 16px}
.xtypes span{background:var(--fill);border-radius:10px;padding:6px 11px;font-size:.84rem;color:var(--soft)}
.xtypes b{color:var(--ink2);font-weight:600;margin-right:6px}
.q .ask.xq{font-size:1.4rem;line-height:1.45;font-weight:600;letter-spacing:-.01em}
.opt.chk .n{border:1.5px solid var(--line)}
.opt.chk.on{background:var(--accentSoft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.opt.chk.on .n{background:var(--accent);color:#fff;border-color:var(--accent)}
.opt.missed{box-shadow:inset 0 0 0 1.5px var(--ok);background:var(--card)}
.opt.missed::after{content:"놓침";margin-left:auto;font-size:.8rem;color:var(--ok);font-weight:700}
.xex{border-radius:14px;padding:14px 16px;margin:6px 0 12px;font-size:1rem}
.xex.ok{background:var(--okSoft)}.xex.bad{background:var(--badSoft)}
.xex b{color:var(--ok)}.xex.bad b{color:var(--bad)}
.xex p{margin:6px 0 0;color:var(--ink2)}
.xex small{display:block;margin-top:4px;color:var(--bad)}
.xwl{display:grid;gap:10px}
.xwl>div{background:var(--fill);border-radius:14px;padding:14px 16px}
.xwl p{margin:0 0 4px}
.xwl .xwq{font-weight:600;margin-bottom:8px}
.xwl span{font-size:.8rem;font-weight:700;margin-right:6px}
.xwl small{display:block;color:var(--soft);margin-top:6px}
@media (max-width:560px){.tabs button{font-size:.88rem}}
</style>
</head>

<div class="wrap">
<h1><span>의학용어</span> 중간고사 Ch.1~4</h1>
<p class="sub">'의용' 단어장 751개 + 4장 PPT 추가분 41개 · 한글 뜻은 단어장·PPT 표기 그대로</p>
<div class="tabs" role="group" aria-label="모드" title="Alt+1~5로 탭 전환">
<button data-mode="list" aria-pressed="true">암기표</button>

<button data-mode="quiz" aria-pressed="false">객관식</button>

</div>
<div class="filters" id="chF"></div>
<div class="filters" id="tyF"></div>
<main id="view"></main>

 V.innerHTML=`<div class="cardtop">${seg("cdir",st.cdir,[["toKo","영어 → 한글"],["toEn","한글 → 영어"]])}<span class="count" style="margin:0">${cur+1} / ${deck.length} · 모름 ${unknown.length}</span></div>

let Q=[],qi=0,score=0,wrong=[],answered=false,kind="mc";
const SK={mc:"mt_sess_mc",sp:"mt_sess_sp"};
function saveQ(){LS.set(SK[kind],{dir:st.dir,qi,score,wrong:wrong.map(w=>({d:w.d.id,a:w.a})),Q:Q.map(x=>kind==="mc"?{d:x.d.id,o:x.opts.map(o=>o.id)}:{d:x.d.id})})}
function loadQ(k){const v=LS.get(SK[k],null);if(!v||!v.Q||v.qi>=v.Q.length)return false;kind=k;if(k==="mc")st.dir=v.dir||st.dir;qi=v.qi;score=v.score;wrong=(v.wrong||[]).map(w=>typeof w==="number"?{d:byId(w),a:""}:{d:byId(w.d),a:w.a});Q=v.Q.map(x=>k==="mc"?{d:byId(x.d),opts:x.o.map(byId)}:{d:byId(x.d)});return true}
/* 헷갈리는 오답 고르기: 철자 모양 + 뜻 + 길이가 비슷한 것 위주 */
const bg=t=>{const x=" "+t+" ",S=new Set();for(let i=0;i<x.length-1;i++)S.add(x.slice(i,i+2));return S};
const dice=(A,B)=>{if(!A.size||!B.size)return 0;let n=0;for(const x of A)if(B.has(x))n++;return 2*n/(A.size+B.size)};
const cleanEn=t=>t.toLowerCase().replace(/\([^)]*\)/g,"").replace(/[^a-z]/g,"");
const cleanKo=t=>t.replace(/\([^)]*\)/g,"").replace(/[^\uac00-\ud7a3]/g,"");
D.forEach(d=>{d.pe=cleanEn(d.p);d.pk=cleanKo(d.ko);d.bE=bg(d.pe);d.bK=bg(d.pk);d.ee=d.en.toLowerCase().trim()});
function simScore(d,x,toKo){
 let sc=dice(d.bE,x.bE)*1.2+dice(d.bK,x.bK)*1.0;
 const e1=d.pe,e2=x.pe;
 if(e1.length>3&&e2.length>3){if(e1.slice(-4)===e2.slice(-4))sc+=.35;else if(e1.slice(-3)===e2.slice(-3))sc+=.2;if(e1.slice(0,3)===e2.slice(0,3))sc+=.3}
 const L1=(toKo?d.ko:d.p).length,L2=(toKo?x.ko:x.p).length;sc-=Math.abs(L1-L2)/Math.max(L1,L2)*.5;
 if(x.ch===d.ch)sc+=.08;
 return sc+Math.random()*.3;
}
function mkQ(items){
 const toKo=st.dir==="toKo";
 return items.map(d=>{
  const bad=x=>x.id===d.id||x.pe===d.pe||x.pk===d.pk||(d.ee&&x.ee===d.ee)||(d.pk&&x.pk&&(x.pk.includes(d.pk)||d.pk.includes(x.pk))&&Math.min(x.pk.length,d.pk.length)>=2);
  let src=D.filter(x=>x.t===d.t&&!bad(x));
  if(src.length<3)src=D.filter(x=>!bad(x));
  const ranked=src.map(x=>[simScore(d,x,toKo),x]).sort((a,b)=>b[0]-a[0]).map(r=>r[1]);
  const ds=[];const seenK=new Set([d.pk]),seenE=new Set([d.pe]);
  for(const x of ranked){if(seenK.has(x.pk)||seenE.has(x.pe))continue;seenK.add(x.pk);seenE.add(x.pe);ds.push(x);if(ds.length===3)break}
  for(const x of src){if(ds.length===3)break;if(!seenK.has(x.pk)&&!seenE.has(x.pe)){seenK.add(x.pk);seenE.add(x.pe);ds.push(x)}}
  return{d,opts:shuf([d,...ds])}});
}

 V.innerHTML=`<div class="q enter"><p class="ttl">${title}</p>${extra}
 <div class="row"><span class="lbl">문제 수</span>${seg("qn",String(Math.min(st.QN,n)===n&&!counts.includes(st.QN)?"all":st.QN),[...counts.map(x=>[String(x),x]),["all",`전체 ${n}`]])}</div>

 ${v&&v.Q&&v.qi<v.Q.length?`<button class="primary" id="resume">이어서 풀기 · ${v.qi+1}번부터 <span class="sm">(${v.Q.length}문제 중 ${v.score}개 맞음)</span></button><div class="gap"></div><button class="primary alt" id="go">새로 시작</button>`:`<button class="primary" id="go">시작</button>`}
 ${H.length?`<p class="note" style="margin-top:16px">최근 기록 · ${H.map(h=>`<b>${h.s}</b>점<span class="sm">(${h.n}문제)</span>`).join(" · ")}</p>`:""}</div>`;
 bindSeg("qn",x=>{st.QN=x==="all"?9999:+x;savePrefs();V.querySelectorAll('[data-seg="qn"] button').forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===x))});

 const rs=$("#resume");if(rs)rs.onclick=()=>{const k=kind;if(loadQ(k))k==="mc"?ask():askS()};
 kb=(e,typing)=>{if(e.key==="Enter"&&!typing&&e.target.tagName!=="BUTTON"){e.preventDefault();(rs||$("#go")).click()}};
 return true;

function ask(){

 answered=false;const {d,opts}=Q[qi];const toKo=st.dir==="toKo";let sel=0;
 V.innerHTML=`<div class="q enter">${progHTML()}

 };

/* ---------- 스펠링 ---------- */
const norm=s=>s.toLowerCase().replace(/[^a-z]/g,"");
function accepts(p){
 const out=new Set();const inner=(p.match(/\(([^)]*)\)/g)||[]).join(",").replace(/[()]/g,"");
 const base=p.replace(/\([^)]*\)/g,"");
 for(const part of (base+","+inner).split(",")){const n=norm(part);if(!n)continue;out.add(n);if(/\/o$|\/i$/.test(part.trim()))out.add(norm(part.trim().slice(0,-2)))}
 return out;
}
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;let p=[...Array(n+1).keys()];for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function spell(){
 kind="sp";
 if(!setup("스펠링 · 한글 보고 영어 쓰기",`<p class="note" style="margin-top:0">기출의 "답 영어로 작성" 대비. 대소문자·띄어쓰기·하이픈은 무시하고, 연결형은 /o 빼고 써도 정답이에요.</p>`))return;
 $("#go").onclick=()=>{Q=shuf(pool()).slice(0,st.QN).map(d=>({d}));qi=0;score=0;wrong=[];askS()};
}
function askS(){
 kb=null;
 if(qi>=Q.length)return finish();
 saveQ();
 answered=false;const {d}=Q[qi];let hint=0;

/* ---------- 모의고사 (기출형) ---------- */
const XT={A:"정의 → 용어",B:"용어 → 뜻",C:"개념",M:"복수정답",S:"영어로 쓰기"};
const XR={A:.38,B:.26,C:.14,M:.08,S:.14};
let X=[],xi=0,xscore=0,xwrong=[],xans=false,XN=P0.XN||25;
const saveX=()=>LS.set("mt_sess_ex",{X:X.map(x=>({i:x.i,ord:x.ord})),xi,xscore,xwrong});
function buildX(n){
 const src=MQ.map((q,i)=>({q,i})).filter(x=>st.chs.has(x.q.ch));
 const by={};src.forEach(x=>(by[x.q.k]=by[x.q.k]||[]).push(x));
 Object.keys(by).forEach(k=>by[k]=shuf(by[k]));
 if(n>=src.length)return shuf(src).map(mkX);
 const pick=[];Object.keys(XR).forEach(k=>{const m=Math.round(n*XR[k]);pick.push(...(by[k]||[]).splice(0,m))});
 const rest=shuf(Object.values(by).flat());while(pick.length<n&&rest.length)pick.push(rest.pop());
 return shuf(pick.slice(0,n)).map(mkX);
}
const mkX=x=>({i:x.i,ord:x.q.o?shuf(x.q.o.map((_,k)=>k)):null});
function mock(){
 const src=MQ.filter(q=>st.chs.has(q.ch));const n=src.length;
 const v=LS.get("mt_sess_ex",null);const H=LS.get("mt_hist",[]).filter(h=>h.k==="ex").slice(-5).reverse();
 const cnt={};src.forEach(q=>cnt[q.k]=(cnt[q.k]||0)+1);
 V.innerHTML=`<div class="q enter"><p class="ttl">모의고사 · 기출형</p>
 <p class="note" style="margin-top:-6px">작년 기출처럼 <b>문제·보기 전부 영어</b>. 답을 고르면 한글 해설이 나와요.</p>
 <div class="xtypes">${Object.entries(XT).map(([k,l])=>`<span><b>${l}</b>${cnt[k]||0}</span>`).join("")}</div>
 <div class="row"><span class="lbl">문항 수</span>${seg("xn",String(XN>=n?"all":XN),[...[15,25,40].filter(x=>x<n).map(x=>[String(x),x]),["all",`전체 ${n}`]])}</div>
 <p class="note">위에서 고른 장(${[...st.chs].sort().join("·")}장)에서 출제 · 유형 비율은 기출과 비슷하게 섞어요</p>
 ${v&&v.X&&v.xi<v.X.length?`<button class="primary" id="xres">이어서 풀기 · ${v.xi+1}번부터 <span class="sm">(${v.X.length}문제 중 ${v.xscore}개 맞음)</span></button><div class="gap"></div><button class="primary alt" id="xgo">새로 시작</button>`:`<button class="primary" id="xgo">시작</button>`}
 ${H.length?`<p class="note" style="margin-top:16px">최근 기록 · ${H.map(h=>`<b>${h.s}</b>점<span class="sm">(${h.n}문제)</span>`).join(" · ")}</p>`:""}</div>`;
 bindSeg("xn",x=>{XN=x==="all"?9999:+x;LS.set("mt_prefs",{...LS.get("mt_prefs",{}),XN});V.querySelectorAll('[data-seg="xn"] button').forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===x))});
 $("#xgo").onclick=()=>{X=buildX(XN);xi=0;xscore=0;xwrong=[];askX()};
 const r=$("#xres");if(r)r.onclick=()=>{X=v.X.map(x=>({i:x.i,ord:x.ord}));xi=v.xi;xscore=v.xscore;xwrong=v.xwrong||[];askX()};
 kb=(e,typing)=>{if(e.key==="Enter"&&!typing&&e.target.tagName!=="BUTTON"){e.preventDefault();(r||$("#xgo")).click()}};
}
const xprog=()=>`<div class="prog"><span>${xi+1} / ${X.length}</span><span><b class="okc">${xscore}</b> 맞음 · <b class="badc">${xwrong.length}</b> 틀림 · <button class="link" id="quit">그만하고 채점</button></span></div><div class="bar"><i style="width:${xi/X.length*100}%"></i></div>`;
function xAfter(ok,q,mine){
 V.firstElementChild.classList.remove("enter");
 const bi=$(".bar i");if(bi)bi.style.width=((xi+1)/X.length*100)+"%";
 if(ok)xscore++;else xwrong.push({i:X[xi].i,a:mine});
 const pr=V.querySelector(".prog span:last-child");if(pr){pr.querySelector(".okc").textContent=xscore;pr.querySelector(".badc").textContent=xwrong.length}
 {const k=xi;xi++;saveX();xi=k}
 $("#after").innerHTML=`<div class="xex ${ok?"ok":"bad"}"><b>${ok?"정답":"오답"}</b>${q.k==="S"?` · 정답: <span class="term">${esc(q.a[0])}</span>`:""}<p>${esc(q.ex)}</p></div><button class="primary" id="nx">${xi+1<X.length?"다음":"결과 보기"}</button>`;
 $("#nx").onclick=()=>swap(()=>{xi++;askX()});
}
function askX(){
 kb=null;if(xi>=X.length)return finishX();
 saveX();xans=false;
 const x=X[xi],q=MQ[x.i];
 const head=`<div class="q enter">${xprog()}<div class="qtag">${q.ch}장 · ${XT[q.k]}</div><div class="ask xq">${xi+1}. ${esc(q.q)}</div>`;
 if(q.k==="S"){
  V.innerHTML=head+`<input class="spell term" id="a" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="영어로 입력 후 Enter">
  <div class="btns" style="margin-top:0"><button class="no" id="pass">모르겠음</button><button class="yes" id="chk">확인</button></div><div id="after"></div>
  <div class="keys"><kbd>Enter</kbd> 확인·다음 · <kbd>Esc</kbd> 채점</div></div>`;
  bindQX();const a=$("#a");a.focus();
  const check=skip=>{if(xans)return;xans=true;const raw=a.value.trim();const v=norm(raw);const ok=!skip&&v&&q.a.some(t=>norm(t)===v);a.disabled=true;
   xAfter(ok,q,skip?"(모름)":raw||"(빈칸)");
   if(!ok&&v&&q.a.some(t=>lev(v,norm(t))<=(t.length>7?2:1)))$(".xex b").textContent="아깝다, 철자 확인!";
   if(!ok&&raw)$(".xex p").insertAdjacentHTML("beforebegin",`<small>내 답: <span class="term">${esc(raw)}</span></small>`);
   $("#nx").focus();kb=e=>{if(e.key==="Escape"){e.preventDefault();xi++;finishX(true)}}};
  $("#chk").onclick=()=>check(false);$("#pass").onclick=()=>check(true);
  a.onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();check(false)}};
  kb=e=>{if(e.key==="Escape"){e.preventDefault();finishX(true)}};
  return;
 }
 const multi=q.k==="M";const ord=x.ord;let sel=0;const chosen=new Set();
 V.innerHTML=head+ord.map((k,i)=>`<button class="opt ${multi?"chk":""} ${i===0?"sel":""}" data-i="${i}"><span class="n">${multi?"":String.fromCharCode(65+i)}</span><span>${esc(q.o[k])}</span></button>`).join("")+
  `${multi?`<button class="primary" id="sub" style="margin-top:4px">제출</button>`:""}<div id="after"></div>
  <div class="keys">${multi?`<kbd>↑</kbd><kbd>↓</kbd> 이동 · <kbd>Space</kbd>/<kbd>1</kbd>~<kbd>${ord.length}</kbd> 체크 · <kbd>Enter</kbd> 제출·다음`:`<kbd>↑</kbd><kbd>↓</kbd> 선택 · <kbd>Enter</kbd>/<kbd>→</kbd> 확인·다음 · <kbd>A</kbd>~<kbd>${String.fromCharCode(64+ord.length)}</kbd>(또는 숫자) 바로 고르기`} · <kbd>Esc</kbd> 채점</div></div>`;
 bindQX();
 const B=[...V.querySelectorAll(".opt")];
 const hi=i=>{sel=(i+B.length)%B.length;B.forEach((b,k)=>b.classList.toggle("sel",k===sel))};
 const tog=i=>{if(xans)return;chosen.has(i)?chosen.delete(i):chosen.add(i);B[i].classList.toggle("on",chosen.has(i));B[i].querySelector(".n").textContent=chosen.has(i)?"✓":"";hi(i)};
 const grade=()=>{
  if(xans)return;if(multi&&!chosen.size)return;xans=true;
  const ans=new Set(multi?q.a:[q.a]);const picked=multi?[...chosen]:[sel];
  const pickedOrig=new Set(picked.map(i=>ord[i]));
  const ok=ans.size===pickedOrig.size&&[...ans].every(a=>pickedOrig.has(a));
  B.forEach((b,i)=>{b.classList.remove("sel");const o=ord[i];if(ans.has(o))b.classList.add("right");else if(pickedOrig.has(o))b.classList.add("wrong");if(multi&&ans.has(o)&&!pickedOrig.has(o))b.classList.add("missed")});
  const sub=$("#sub");if(sub)sub.remove();
  xAfter(ok,q,picked.map(i=>q.o[ord[i]]).join(", "));
 };
 B.forEach((b,i)=>b.onclick=()=>{if(multi)tog(i);else{hi(i);grade()}});
 const sb=$("#sub");if(sb)sb.onclick=grade;
 kb=(e,typing)=>{if(typing)return;
  if(e.key==="Escape"){e.preventDefault();if(xans)xi++;finishX(true);return}
  if(!xans){
   if(e.key==="ArrowDown"){e.preventDefault();hi(sel+1)}
   else if(e.key==="ArrowUp"){e.preventDefault();hi(sel-1)}
   else if(/^[1-9]$/.test(e.key)&&+e.key<=B.length){e.preventDefault();multi?tog(+e.key-1):(hi(+e.key-1),grade())}
   else if(/^[a-eA-E]$/.test(e.key)&&e.key.toLowerCase().charCodeAt(0)-97<B.length){e.preventDefault();const i=e.key.toLowerCase().charCodeAt(0)-97;multi?tog(i):(hi(i),grade())}
   else if(multi&&e.key===" "){e.preventDefault();tog(sel)}
   else if(e.key==="Enter"||(!multi&&(e.key===" "||e.key==="ArrowRight"))){e.preventDefault();grade()}
  }else if(e.key==="Enter"||e.key===" "||e.key==="ArrowRight"){e.preventDefault();swap(()=>{xi++;askX()})}
 };
}
function bindQX(){const q=$("#quit");if(q)q.onclick=()=>finishX(true)}
function finishX(early=false){
 kb=null;const total=early?Math.min(xi,X.length):X.length;LS.set("mt_sess_ex",null);
 if(!total){mock();return}
 const pct=Math.round(xscore/total*100);
 const H=LS.get("mt_hist",[]);H.push({k:"ex",s:pct,n:total,t:Date.now()});LS.set("mt_hist",H.slice(-30));
 const done=X.slice(0,total).map(x=>x.i);const ws=new Set(xwrong.map(w=>w.i));
 const byT=Object.keys(XT).map(k=>{const a=done.filter(i=>MQ[i].k===k);return a.length?{l:XT[k],n:a.length,ok:a.filter(i=>!ws.has(i)).length}:null}).filter(Boolean);
 V.innerHTML=`<div class="q enter"><div class="score">${pct}<small>점 · ${xscore}/${total}${early?` (${X.length}문제 중 ${total}개 풀고 채점)`:""}</small></div>
 <p class="verdict">${pct>=90?"이대로만 보면 돼요 👏":pct>=70?"좋아요, 틀린 유형만 한 번 더!":pct>=50?"목표 50점은 넘었어요. 오답 해설 위주로 보세요":"해설 읽고 틀린 것만 다시 풀어봐요"}</p>
 <div class="chs">${byT.map(t=>`<div><span>${t.l}</span><b>${Math.round(t.ok/t.n*100)}%</b><i style="--w:${t.ok/t.n*100}%"></i><small>${t.ok}/${t.n}</small></div>`).join("")}</div>
 ${xwrong.length?`<p class="ttl" style="font-size:1.05rem;margin:22px 0 8px">틀린 문제 ${xwrong.length}개</p><div class="xwl">${xwrong.map(w=>{const q=MQ[w.i];const ans=q.k==="S"?q.a[0]:(Array.isArray(q.a)?q.a:[q.a]).map(k=>q.o[k]).join(", ");return `<div><p class="xwq">${esc(q.q)}</p><p><span class="okc">정답</span> ${esc(ans)}</p>${w.a?`<p><span class="badc">내 답</span> ${esc(w.a)}</p>`:""}<small>${esc(q.ex)}</small></div>`}).join("")}</div>
 <div class="gap"></div><button class="primary" id="xrw">틀린 것만 다시 풀기</button><div class="gap"></div>`:`<p style="text-align:center">전부 맞았어요!</p>`}
 <button class="primary alt" id="xrn">새로 풀기</button></div>`;
 const rw=$("#xrw");if(rw)rw.onclick=()=>{X=shuf(xwrong.map(w=>({i:w.i,ord:MQ[w.i].o?shuf(MQ[w.i].o.map((_,k)=>k)):null})));xi=0;xscore=0;xwrong=[];askX()};
 $("#xrn").onclick=mock;
 kb=(e,typing)=>{if(e.key==="Enter"&&!typing&&e.target.tagName!=="BUTTON"){e.preventDefault();(rw||$("#xrn")).click()}};
}

document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===st.mode));
render();
</script>
</body>
</html>
