<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>의학용어 중간고사 Ch.1~4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Literata:opsz,wght@7..72,600;7..72,700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#F2F4F6;--ink:#191F28;--ink2:#333D4B;--soft:#8B95A1;--line:#E5E8EB;--fill:#F2F4F6;--card:#FFFFFF;--accent:#3182F6;--accentSoft:#E8F3FF;--ok:#03B26C;--okSoft:#E5F8EF;--bad:#F04452;--badSoft:#FFEBEE;--mark:#FFF3B0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101013;--ink:#F2F4F6;--ink2:#D1D6DB;--soft:#8B95A1;--line:#2B2B30;--fill:#26262B;--card:#1C1C20;--accent:#4C93FF;--accentSoft:#1B2A45;--ok:#2BD08A;--okSoft:#13302A;--bad:#FF6170;--badSoft:#3A1C22;--mark:#5A4E12}}
:root[data-theme="dark"]{--bg:#101013;--ink:#F2F4F6;--ink2:#D1D6DB;--soft:#8B95A1;--line:#2B2B30;--fill:#26262B;--card:#1C1C20;--accent:#4C93FF;--accentSoft:#1B2A45;--ok:#2BD08A;--okSoft:#13302A;--bad:#FF6170;--badSoft:#3A1C22;--mark:#5A4E12}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif;line-height:1.5;font-size:19px;-webkit-text-size-adjust:100%;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:820px;margin:0 auto;padding:28px 24px 72px}
h1{font-size:1.85rem;font-weight:700;margin:8px 4px 2px;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.sub{color:var(--soft);font-size:.9rem;margin:0 4px 16px}
.term{font-weight:700;letter-spacing:-.005em}
.tabs{display:flex;gap:2px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--fill);padding:4px;border-radius:12px;z-index:5;margin-bottom:12px;box-shadow:0 0 0 8px var(--bg)}
.tabs button{flex:1;padding:12px 0;border:none;background:transparent;color:var(--soft);font:inherit;font-size:1rem;font-weight:600;border-radius:9px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.chip{padding:9px 16px;border-radius:999px;border:none;background:var(--card);color:var(--ink2);font:inherit;font-size:.95rem;font-weight:500;cursor:pointer}
.chip.on{background:var(--ink);color:var(--card)}
.chip.wr.on{background:var(--bad);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.count{font-size:.92rem;color:var(--soft);margin:4px 4px 8px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:18px;overflow:hidden}
td{padding:16px 22px;border-bottom:1px solid var(--line);vertical-align:top;font-size:1.08rem}
tr:last-child td{border-bottom:none}
td.p{width:45%;word-break:break-word;color:var(--ink)}
td.k{color:var(--ink2)}
td .en{display:block;color:var(--soft);font-size:.8rem;margin-top:2px}
td .w{color:var(--bad);font-size:.72rem;font-weight:600;margin-left:6px}
.hide-ko td.k .ko{background:var(--fill);color:transparent;border-radius:6px;cursor:pointer}
.hide-ko td.k .ko.show{background:none;color:inherit}
.search,.spell{width:100%;padding:17px 18px;border:none;border-radius:14px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:10px;box-shadow:inset 0 0 0 1px var(--line)}
.search:focus,.spell:focus{box-shadow:inset 0 0 0 2px var(--accent);outline:none}
.spell{font-size:1.35rem;font-weight:600;background:var(--fill);box-shadow:none}
.row{display:flex;gap:8px;align-items:center;margin:0 4px 10px;flex-wrap:wrap}
.row label{font-size:.9rem;color:var(--ink2);display:flex;gap:8px;align-items:center}
.q .row{margin-left:0}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:18px;height:18px}
.flash{background:var(--card);border-radius:24px;min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 24px;text-align:center;cursor:pointer;user-select:none}
.flash .big{font-size:2.7rem;word-break:break-word;letter-spacing:-.02em}
.flash .ans{margin-top:18px;font-size:1.7rem;font-weight:600;color:var(--accent)}
.flash .ans mark{background:none;color:inherit;padding:0}
.flash .en{color:var(--soft);font-size:.9rem;margin-top:4px}
.flash .hint{color:var(--soft);font-size:.82rem;margin-top:18px}
.btns{display:flex;gap:8px;margin-top:12px}
.btns button,.primary{flex:1;padding:18px;border-radius:16px;border:none;font:inherit;font-size:1.08rem;font-weight:600;cursor:pointer}
.no{background:var(--fill);color:var(--ink2)}
.q .no{background:var(--fill)}
.flash~.btns .no{background:var(--card)}
.yes{background:var(--accent);color:#fff}
.primary{background:var(--accent);color:#fff;width:100%}
.primary.alt{background:var(--accentSoft);color:var(--accent)}
.q{background:var(--card);border-radius:24px;padding:32px 28px}
.q .prog{font-size:.92rem;color:var(--soft);display:flex;justify-content:space-between;gap:8px;font-weight:500}
.bar{height:4px;background:var(--fill);border-radius:99px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.q .ask{font-size:2.2rem;font-weight:700;margin:28px 0 28px;word-break:break-word;letter-spacing:-.02em}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:19px 20px;font-size:1.15rem;font-weight:500;margin-bottom:10px;border:none;border-radius:16px;background:var(--fill);color:var(--ink);font-family:inherit;cursor:pointer;box-shadow:inset 0 0 0 1.5px transparent}
.opt .n{flex:none;width:30px;height:30px;border-radius:8px;background:var(--card);color:var(--soft);font-size:.9rem;font-weight:700;display:grid;place-items:center}
.opt.sel{background:var(--accentSoft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.opt.sel .n{background:var(--accent);color:#fff}
.opt.right{background:var(--okSoft);box-shadow:inset 0 0 0 1.5px var(--ok)}
.opt.right .n{background:var(--ok);color:#fff}
.opt.wrong{background:var(--badSoft);box-shadow:inset 0 0 0 1.5px var(--bad)}
.opt.wrong .n{background:var(--bad);color:#fff}
.keys{font-size:.85rem;color:var(--soft);text-align:center;margin-top:10px}
.keys kbd{font-family:inherit;background:var(--fill);border-radius:5px;padding:1px 6px;margin:0 1px}
.fb{padding:14px 16px;font-size:1.1rem;border-radius:12px;margin:10px 0;font-weight:600}
.fb.ok{background:var(--okSoft);color:var(--ok)}
.fb.bad{background:var(--badSoft);color:var(--bad)}
.score{font-size:3.6rem;font-weight:800;text-align:center;margin:4px 0 8px;color:var(--accent);letter-spacing:-.03em}
.score small{font-size:1rem;color:var(--soft);font-weight:500;letter-spacing:0}
.wrongs{padding-left:18px;color:var(--ink2)}
.wrongs li{margin-bottom:6px}
.note{font-size:.92rem;color:var(--soft)}
select{font:inherit;padding:6px 10px;background:var(--fill);color:var(--ink);border:none;border-radius:8px}
@media (prefers-reduced-motion:no-preference){.flash,.opt,.chip,.btns button,.primary,.tabs button{transition:transform .1s,background .15s,box-shadow .15s}.flash:active,.opt:active,.btns button:active,.primary:active{transform:scale(.98)}}
</style>
</head>

 if(reset&&!fresh){const v=getS("card");if(v&&v.deck&&v.cur<v.deck.length){
  V.innerHTML=`<div class="q"><p style="font-size:1.25rem;font-weight:700;margin-top:0">카드</p><p class="note">지난번에 ${v.deck.length}장 중 ${v.cur}장까지 넘겼어요 (모름 ${v.unknown.length}장)</p>
  <button class="primary" id="cres">이어서 하기 · ${v.cur+1}번째 카드부터</button><div style="height:10px"></div><button class="primary alt" id="cnew">새로 섞기 (현재 범위 ${pool().length}장)</button></div>`;
  $("#cres").onclick=()=>{deck=v.deck.map(byId);cur=v.cur;unknown=v.unknown.map(byId);flipped=false;card(false)};
  $("#cnew").onclick=()=>card(true,true);
  kb=e=>{if(e.key==="Enter"||e.key==="ArrowRight"){e.preventDefault();$("#cres").click()}};return}}
 if(reset){deck=shuf(pool());cur=0;unknown=[];flipped=false}
 if(!deck.length)return empty();
 putS("card",cur<deck.length?{deck:deck.map(d=>d.id),cur,unknown:unknown.map(d=>d.id)}:null);
 if(cur>=deck.length){
  V.innerHTML=`<div class="q"><p style="font-size:1.2rem;font-weight:700;margin-top:0">한 바퀴 끝!</p><p>모르는 카드 ${unknown.length}개</p>
  ${unknown.length?`<button class="primary" id="again">모르는 것만 다시</button><div style="height:8px"></div>`:""}
  <button class="primary alt" id="restart">전체 다시 섞기</button></div>`;
  const a=$("#again");if(a)a.onclick=()=>{deck=shuf(unknown);unknown=[];cur=0;flipped=false;card(false)};
  $("#restart").onclick=()=>card(true,true);return}
 const d=deck[cur];
 V.innerHTML=`<div class="count">${cur+1} / ${deck.length} · 모름 ${unknown.length} · ${d.ch}장 ${TY[d.t]}</div>
 <div class="flash" id="f" tabindex="0" role="button" aria-label="카드 뒤집기"><div class="big term">${esc(d.p)}</div>
 ${flipped?`<div class="ans"><mark>${esc(d.ko)}</mark></div>${d.en?`<div class="en">${esc(d.en)}</div>`:""}`:`<div class="hint">눌러서 뜻 보기 · 키보드: Space 뒤집기, ← 몰라요, → 알아요</div>`}</div>
 <div class="btns"><button class="no" id="n">몰라요</button><button class="yes" id="y">알아요</button></div>`;
 const f=$("#f");f.onclick=()=>{flipped=!flipped;card(false)};f.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();f.click()}};
 $("#n").onclick=()=>{unknown.push(d);mark(d,false);cur++;flipped=false;card(false)};
 $("#y").onclick=()=>{cur++;flipped=false;card(false)};
 kb=e=>{if(e.target.id==="f"&&(e.key===" "||e.key==="Enter"))return;if(e.key===" "||e.key==="ArrowUp"||e.key==="ArrowDown"){e.preventDefault();f.click()}else if(e.key==="ArrowLeft"){e.preventDefault();$("#n").click()}else if(e.key==="ArrowRight"){e.preventDefault();$("#y").click()}};
}
let Q=[],qi=0,score=0,wrong=[],answered=false,QN=20,kind="mc";
const SK={mc:"mt_sess_mc",sp:"mt_sess_sp",card:"mt_sess_card"};
const getS=k=>{try{return JSON.parse(localStorage.getItem(SK[k])||"null")}catch(e){return null}};
const putS=(k,v)=>{try{v?localStorage.setItem(SK[k],JSON.stringify(v)):localStorage.removeItem(SK[k])}catch(e){}};
const byId=id=>D[id];
function saveQ(){putS(kind,{dir:st.dir,qi,score,wrong:wrong.map(d=>d.id),Q:Q.map(x=>kind==="mc"?{d:x.d.id,o:x.opts.map(o=>o.id)}:{d:x.d.id})})}
function loadQ(k){const v=getS(k);if(!v||!v.Q||v.qi>=v.Q.length)return false;kind=k;st.dir=v.dir||st.dir;qi=v.qi;score=v.score;wrong=v.wrong.map(byId);Q=v.Q.map(x=>k==="mc"?{d:byId(x.d),opts:x.o.map(byId)}:{d:byId(x.d)});return true}
function mkQ(items){
 const all=pool().length>=8?pool():D;
 return items.map(d=>{
  let src=all.filter(x=>x.t===d.t&&x.ch===d.ch&&x.ko!==d.ko&&x.p!==d.p);
  if(src.length<6)src=D.filter(x=>x.t===d.t&&x.ko!==d.ko&&x.p!==d.p);
  const seen=new Set([d.ko]),seenP=new Set([d.p]);const ds=[];
  for(const x of shuf(src)){if(!seen.has(x.ko)&&!seenP.has(x.p)){seen.add(x.ko);seenP.add(x.p);ds.push(x)}if(ds.length===3)break}
  return{d,opts:shuf([d,...ds])}});
}
function setup(title,extra){
 const n=pool().length;if(!n)return empty();
 V.innerHTML=`<div class="q"><p style="margin-top:0;font-weight:700">${title}</p>${extra}
 <div class="row"><label>문제 수 <select id="n">${[10,20,30,50,100].map(x=>`<option ${x===QN?"selected":""}>${x}</option>`).join("")}</select></label></div>
 <p class="note">위에서 고른 범위 ${n}개 중 출제${st.wonly?" (오답만)":""}</p><button class="primary" id="go">새로 시작</button>
 ${(()=>{const v=getS(kind);return v&&v.Q&&v.qi<v.Q.length?`<div style="height:10px"></div><button class="primary alt" id="resume">이어서 풀기 · ${v.qi+1}번부터 (${v.Q.length}문제 중, 현재 ${v.score}개 맞음)</button>`:""})()}</div>`;
 const rs=$("#resume");if(rs)rs.onclick=()=>{const k=kind;if(loadQ(k))k==="mc"?ask():askS()};
 $("#n").onchange=e=>QN=+e.target.value;
 kb=e=>{if(e.key==="Enter"&&e.target.tagName!=="SELECT"&&e.target.tagName!=="BUTTON"){e.preventDefault();$("#go").click()}};
 V.querySelectorAll('input[name=dir]').forEach(r=>r.onchange=()=>st.dir=r.value);
 return true;
}
function quiz(){
 kind="mc";
 if(!setup("객관식 4지선다",`<div class="row"><label><input type="radio" name="dir" value="toKo" ${st.dir==="toKo"?"checked":""}> 영어 → 한글 뜻</label></div>
 <div class="row"><label><input type="radio" name="dir" value="toTerm" ${st.dir==="toTerm"?"checked":""}> 한글 뜻 → 영어</label></div>`))return;
 $("#go").onclick=()=>{Q=mkQ(shuf(pool()).slice(0,QN));qi=0;score=0;wrong=[];ask()};
}
function ask(){
 if(qi>=Q.length)return result();
 saveQ();
 answered=false;const {d,opts}=Q[qi];const toKo=st.dir==="toKo";let sel=0;
 V.innerHTML=`<div class="q"><div class="prog"><span>${qi+1} / ${Q.length}</span><span>${d.ch}장 ${TY[d.t]}</span></div><div class="bar"><i style="width:${qi/Q.length*100}%"></i></div>
 <div class="ask ${toKo?"term":""}">${esc(toKo?d.p:d.ko)}</div>
 ${opts.map((o,i)=>`<button class="opt ${toKo?"":"term"} ${i===0?"sel":""}" data-i="${i}"><span class="n">${i+1}</span><span>${esc(toKo?o.ko:o.p)}</span></button>`).join("")}<div id="after"></div>
 <div class="keys"><kbd>↑</kbd><kbd>↓</kbd> 선택 · <kbd>Enter</kbd>/<kbd>→</kbd> 확인·다음 · <kbd>1</kbd>~<kbd>4</kbd> 바로 고르기</div></div>`;
 const B=[...V.querySelectorAll(".opt")];
 const hi=i=>{sel=(i+B.length)%B.length;B.forEach((x,k)=>x.classList.toggle("sel",k===sel))};
 const pick=i=>{
  if(answered)return;answered=true;hi(i);const o=opts[i];const ok=o.id===d.id;
  B.forEach(x=>x.classList.remove("sel"));
  if(ok)score++;else{B[i].classList.add("wrong");wrong.push(d)}mark(d,ok);
  B.forEach((x,k)=>{if(opts[k].id===d.id)x.classList.add("right")});
  next(`${esc(d.p)} = ${esc(d.ko)}${d.en?` (${esc(d.en)})`:""}`);
 };
 B.forEach((b,i)=>b.onclick=()=>pick(i));
 kb=e=>{
  const tag=e.target.tagName;if(tag==="INPUT"||tag==="SELECT")return;
  if(!answered){
   if(e.key==="ArrowDown"){e.preventDefault();hi(sel+1)}
   else if(e.key==="ArrowUp"){e.preventDefault();hi(sel-1)}
   else if(e.key==="Enter"||e.key===" "||e.key==="ArrowRight"){e.preventDefault();pick(sel)}
   else if(/^[1-4]$/.test(e.key)&&+e.key<=B.length){e.preventDefault();pick(+e.key-1)}
  }else if(e.key==="Enter"||e.key===" "||e.key==="ArrowRight"){e.preventDefault();qi++;ask()}
 };
}
function next(info){
 {const k=qi;qi++;saveQ();qi=k}
 $("#after").innerHTML=`<p class="note">${info}</p><button class="primary" id="nx">다음</button>`;
 $("#nx").onclick=()=>{qi++;kind==="mc"?ask():askS()};if(kind!=="mc")$("#nx").focus();
}
const norm=s=>s.toLowerCase().replace(/[^a-z]/g,"");
function accepts(p){
 const out=new Set();const inner=(p.match(/\(([^)]*)\)/g)||[]).join(",").replace(/[()]/g,"");
 const base=p.replace(/\([^)]*\)/g,"");
 for(const part of (base+","+inner).split(",")){const n=norm(part);if(!n)continue;out.add(n);if(/\/o$|\/i$/.test(part.trim()))out.add(norm(part.trim().slice(0,-2)))}
 return out;
}
function spell(){
 kind="sp";
 if(!setup("스펠링 (한글 보고 영어 쓰기)",`<p class="note" style="margin-top:0">기출처럼 "답 영어로 작성" 대비. 대소문자·띄어쓰기·하이픈은 무시하고, 연결형은 /o 빼고 써도 정답이에요.</p>`))return;
 $("#go").onclick=()=>{Q=shuf(pool()).slice(0,QN).map(d=>({d}));qi=0;score=0;wrong=[];askS()};
}
function askS(){
 kb=null;
 if(qi>=Q.length)return result();
 saveQ();
 answered=false;const {d}=Q[qi];
 V.innerHTML=`<div class="q"><div class="prog"><span>${qi+1} / ${Q.length}</span><span>${d.ch}장 ${TY[d.t]}</span></div><div class="bar"><i style="width:${qi/Q.length*100}%"></i></div>
 <div class="ask">${esc(d.ko)}</div>${d.en?`<p class="note" style="margin-top:-8px">${esc(d.en)}</p>`:""}
 <input class="spell term" id="a" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="영어로 입력">
 <div class="btns" style="margin-top:0"><button class="no" id="pass">모르겠음</button><button class="yes" id="chk">확인</button></div><div id="after"></div></div>`;
 const a=$("#a");a.focus();
 const go=(skip)=>{if(answered)return;answered=true;const v=norm(a.value);const ok=!skip&&v&&accepts(d.p).has(v);
  if(ok)score++;else wrong.push(d);mark(d,ok);a.disabled=true;
  $("#after").innerHTML=`<div class="fb ${ok?"ok":"bad"}">${ok?"정답!":"정답: "}<span class="term">${esc(d.p)}</span></div>`;
  const div=document.createElement("div");$("#after").appendChild(div);div.id="after2";
  $("#after2").outerHTML=`<button class="primary" id="nx">다음</button>`;$("#nx").onclick=()=>{qi++;askS()};$("#nx").focus()};
 $("#chk").onclick=()=>go(false);$("#pass").onclick=()=>go(true);
 a.onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();go(false)}};
}
function result(){
 kb=null;putS(kind,null);
 const pct=Math.round(score/Q.length*100);
 V.innerHTML=`<div class="q"><div class="score">${pct}<small>점 (${score}/${Q.length})</small></div>
 ${wrong.length?`<p style="font-weight:700">틀린 문제</p><ul class="wrongs">${wrong.map(d=>`<li><span class="term">${esc(d.p)}</span> – ${esc(d.ko)}</li>`).join("")}</ul>
 <button class="primary" id="rw">틀린 것만 다시 풀기</button><div style="height:8px"></div>`:`<p style="text-align:center">전부 맞았어요!</p>`}
 <button class="primary alt" id="rn">새로 풀기</button></div>`;
 const rw=$("#rw");if(rw)rw.onclick=()=>{Q=kind==="mc"?mkQ(shuf(wrong)):shuf(wrong).map(d=>({d}));qi=0;score=0;wrong=[];kind==="mc"?ask():askS()};
 $("#rn").onclick=()=>kind==="mc"?quiz():spell();chips();
}
render();
</script>
</body>
</html>
