<style>
:root{
  color-scheme: light;
  --paper:#fbf8fb; --surface:#ffffff; --ink:#221b2e; --muted:#6f667a; --line:#e6dfe8;
  --hema:#4a3d8f; --hema-soft:#ebe7f8; --on-hema:#ffffff;
  --eosin:#c8456f; --eosin-soft:#fbe4ec;
  --ok:#22795a; --ok-soft:#dcf1e6;
  --empty:#e9e4ec;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#16131b; --surface:#201c27; --ink:#ece8f2; --muted:#a59cb0; --line:#342e3d;
    --hema:#a99cf0; --hema-soft:#2c2645; --on-hema:#16131b;
    --eosin:#f07a9f; --eosin-soft:#3d2030;
    --ok:#5cc79a; --ok-soft:#183a2c;
    --empty:#332d3b;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#16131b; --surface:#201c27; --ink:#ece8f2; --muted:#a59cb0; --line:#342e3d;
  --hema:#a99cf0; --hema-soft:#2c2645; --on-hema:#16131b;
  --eosin:#f07a9f; --eosin-soft:#3d2030;
  --ok:#5cc79a; --ok-soft:#183a2c;
  --empty:#332d3b;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  font-size:17px; line-height:1.6; -webkit-text-size-adjust:100%; word-break:keep-all; overflow-wrap:anywhere;
}
.wrap{max-width:780px; margin:0 auto; padding:20px 18px 48px}
header{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap}
h1{font-size:1.5rem; font-weight:700; margin:0; letter-spacing:-0.01em}
.tally{font-size:.95rem; color:var(--muted); font-variant-numeric:tabular-nums; display:flex; gap:12px}
.tally .o{color:var(--ok); font-weight:600} .tally .x{color:var(--eosin); font-weight:600}

.controls{display:flex; flex-direction:column; gap:10px; margin:16px 0 14px}
.controls .line{display:flex; flex-wrap:wrap; gap:10px}
.seg{display:inline-flex; flex-wrap:wrap; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:3px; gap:2px}
.seg button{
  font:inherit; font-size:.9rem; border:0; background:transparent; color:var(--muted);
  padding:6px 12px; border-radius:7px; cursor:pointer; min-height:36px;
}
.seg button[aria-pressed="true"]{background:var(--hema); color:var(--on-hema); font-weight:600}
.seg button:disabled{opacity:.38; cursor:default}

.stripbar{display:flex; justify-content:space-between; align-items:center; margin:2px 0 6px; font-size:.85rem; color:var(--muted)}
.strip{display:grid; grid-template-columns:repeat(auto-fill,minmax(22px,1fr)); gap:5px; margin:0 0 22px}
.strip.folded{max-height:84px; overflow:hidden}
.cell{aspect-ratio:1; border:0; border-radius:50%; background:var(--empty); cursor:pointer; padding:0; font:inherit; font-size:0}
.cell.o{background:var(--ok)}
.cell.x{background:var(--eosin)}
.cell.cur{outline:2.5px solid var(--hema); outline-offset:2px}

.card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:22px 20px}
.meta{font-size:.88rem; color:var(--muted); margin:0 0 8px}
.q{font-size:1.14rem; font-weight:600; margin:0 0 18px; line-height:1.55}
.choices{display:grid; gap:9px}
.choice{
  font:inherit; text-align:left; display:flex; gap:12px; align-items:flex-start;
  background:transparent; color:var(--ink); border:1.5px solid var(--line); border-radius:12px;
  padding:12px 14px; cursor:pointer; min-height:48px; line-height:1.5;
}
.choice .n{flex:none; width:1.5em; color:var(--muted); font-weight:600}
.choice:hover:not(:disabled){border-color:var(--hema)}
.choice:disabled{cursor:default}
.choice.right{border-color:var(--ok); background:var(--ok-soft)}
.choice.right .n{color:var(--ok)}
.choice.wrong{border-color:var(--eosin); background:var(--eosin-soft)}
.choice.wrong .n{color:var(--eosin)}
.choice.dim{opacity:.55}

.verdict{margin:18px 0 6px; font-weight:700; font-size:1.05rem}
.verdict.o{color:var(--ok)} .verdict.x{color:var(--eosin)}
.exp{background:var(--hema-soft); border-radius:12px; padding:14px 16px; margin-top:8px; line-height:1.75}
.exp p{margin:0 0 8px}
.exp p:last-of-type{margin-bottom:4px}
.exp .ans{font-weight:700; margin-bottom:10px}
.exp .notes{list-style:none; margin:0 0 12px; padding:0; display:grid; gap:6px}
.exp .notes li{padding:8px 10px; border-radius:9px; background:var(--surface); line-height:1.6}
.exp .notes .mk{font-weight:600; margin-right:4px}
.exp .notes li.t .mk{color:var(--ok)}
.exp .notes li.f .mk{color:var(--eosin)}
.exp .notes .why{color:var(--ink)}
.exp .pg{font-size:.88rem; color:var(--hema); font-weight:600; margin:10px 0 0}
.guess{font:inherit; font-size:.85rem; font-weight:600; margin-left:10px; padding:5px 10px; border-radius:8px; border:1.5px solid var(--line); background:var(--surface); color:var(--muted); cursor:pointer; vertical-align:middle}


.nav{display:flex; justify-content:space-between; gap:10px; margin-top:18px}
.btn{
  font:inherit; font-size:.98rem; font-weight:600; border-radius:12px; padding:12px 18px; min-height:48px;
  cursor:pointer; border:1.5px solid var(--line); background:var(--surface); color:var(--ink);
}
.btn.primary{background:var(--hema); border-color:var(--hema); color:var(--on-hema)}
.btn:disabled{opacity:.4; cursor:default}

.empty, .summary{text-align:center; padding:34px 20px}
.summary .big{font-size:2.6rem; font-weight:700; font-variant-numeric:tabular-nums; margin:6px 0}
.summary p{color:var(--muted); margin:6px 0 20px}
.summary .row{display:flex; justify-content:center; gap:10px; flex-wrap:wrap}

footer{margin-top:28px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; font-size:.85rem; color:var(--muted)}
footer .tools{display:flex; gap:14px}
.link{font:inherit; font-size:.85rem; background:none; border:0; color:var(--muted); text-decoration:underline; cursor:pointer; padding:6px 0}

dialog{border:1px solid var(--line); border-radius:16px; background:var(--surface); color:var(--ink); padding:20px; width:min(92vw,520px)}
dialog::backdrop{background:rgba(20,15,30,.45)}
dialog h2{font-size:1.1rem; margin:0 0 8px}
dialog p{margin:0 0 12px; color:var(--muted); font-size:.92rem}
dialog textarea{width:100%; height:140px; font:inherit; font-size:.8rem; border:1px solid var(--line); border-radius:10px; padding:10px; background:var(--paper); color:var(--ink)}
dialog .row{display:flex; justify-content:flex-end; gap:8px; margin-top:12px; flex-wrap:wrap}

button:focus-visible{outline:2.5px solid var(--hema); outline-offset:2px}
@media (prefers-reduced-motion: no-preference){
  .exp,.verdict{animation:rise .18s ease-out}
  @keyframes rise{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}
}
@media (max-width:480px){
  .wrap{padding:16px 14px 40px}
  .card{padding:18px 15px}
  .q{font-size:1.06rem}
}
</style>
</head>

<div class="wrap">

    <button class="btn" id="importBtn">가져오기</button>
    <button class="btn primary" id="closeDlg">닫기</button>

<script>
(function(){
  const LECTURE_META = {1:'세포학, 조직학 서론', 2:'발생학 서론', 3:'상피와 고유결합조직', 4:'연골과 뼈', 5:'혈액', 6:'근육조직'};
  const KEY = 'ingugi-quiz:v2';
  const NUM = ['①','②','③','④','⑤','⑥'];

  // 데이터 블록 모으기
  const blocks = [];
  document.querySelectorAll('script.quiz-data').forEach(el => {
    try { blocks.push(JSON.parse(el.textContent)); } catch(e) { console.error('데이터 블록 오류', e); }
  });
  const Q = [];
  blocks.sort((a,b) => a.lecture - b.lecture).forEach(b => {
    if (b.title) LECTURE_META[b.lecture] = b.title;
    b.items.forEach(it => Q.push(Object.assign({ lecture:b.lecture }, it)));
  });
  const byId = Object.fromEntries(Q.map(q => [q.id, q]));
  const available = [...new Set(Q.map(q => q.lecture))];

  let store = { records:{}, session:null, prefs:{ lectures:'all', mode:'all', order:'seq' } };
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const s = JSON.parse(raw);
      store.records = s.records || {};
      store.session = s.session || null;
      if (s.prefs) store.prefs = Object.assign(store.prefs, s.prefs);
      if (!Array.isArray(store.prefs.lectures) && store.prefs.lectures !== 'all') store.prefs.lectures = 'all';
    }
  } catch(e) {}
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e) {} }

  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const $ = s => document.querySelector(s);
  const main = $('#main'), strip = $('#strip'), tally = $('#tally');
  const rnd = n => Math.floor(Math.random() * n);
  function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  let list = [], idx = 0, inst = null, picked = null, stripOpen = false;

  // 강 선택
  function selectedLectures(){
    const L = store.prefs.lectures;
    if (L === 'all') return available.slice();
    const sel = L.filter(n => available.includes(n));
    return sel.length ? sel : available.slice();
  }
  function renderLectureSeg(){
    const isAll = store.prefs.lectures === 'all';
    let html = `<button data-v="all" aria-pressed="${isAll}">전체</button>`;
    Object.keys(LECTURE_META).map(Number).sort((a,b)=>a-b).forEach(n => {
      const has = available.includes(n);
      const on = !isAll && store.prefs.lectures.includes(n);
      html += `<button data-v="${n}" aria-pressed="${on}" ${has ? '' : 'disabled title="준비 중"'}>${n}강</button>`;
    });
    $('#lectureSeg').innerHTML = html;
  }
  $('#lectureSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    if (b.dataset.v === 'all') store.prefs.lectures = 'all';
    else {
      const n = +b.dataset.v;
      let cur = store.prefs.lectures === 'all' ? [] : store.prefs.lectures.slice();
      cur = cur.includes(n) ? cur.filter(x => x !== n) : cur.concat(n).sort((a,b)=>a-b);
      store.prefs.lectures = cur.length ? cur : 'all';
    }
    rebuild(true);
  });
  function bindSeg(el, k){
    el.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      store.prefs[k] = b.dataset.v; rebuild(true);
    });
  }
  bindSeg($('#modeSeg'),'mode'); bindSeg($('#orderSeg'),'order');
  function syncSegs(){
    renderLectureSeg();
    [['#modeSeg','mode'],['#orderSeg','order']].forEach(([s,k]) => {
      document.querySelectorAll(s + ' button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === store.prefs[k])));
    });
  }

  function sessionKey(){ const p = store.prefs; return [selectedLectures().join(','), p.mode, p.order].join('|'); }
  function pool(){ const L = selectedLectures(); return Q.filter(q => L.includes(q.lecture)); }
  function status(id){ const r = store.records[id]; return r ? (r.last ? 'o' : 'x') : ''; }

  function rebuild(fresh){
    const p = store.prefs, k = sessionKey(), s = store.session;
    if (!fresh && s && s.key === k && Array.isArray(s.list) && s.list.length && s.list.every(id => byId[id])) {
      list = s.list; idx = Math.min(s.idx || 0, list.length);
    } else {
      let qs = pool();
      if (p.mode === 'wrong') qs = qs.filter(q => status(q.id) === 'x');
      if (p.mode === 'unseen') qs = qs.filter(q => !store.records[q.id]);
      list = qs.map(q => q.id);
      if (p.order === 'rand') list = shuffle(list);
      idx = 0;
    }
    store.session = { key:k, list, idx };
    save(); syncSegs(); newQuestion(); render();
  }

  // 문제 만들기: 같은 개념이라도 풀 때마다 문제 형태가 바뀐다
  function makeInstance(it){
    const r = store.records[it.id] || {};
    if (it.kind === 'pool') {
      // 지난번과 반대 방향을 우선 (옳은 것 ↔ 옳지 않은 것)
      let positive = r.lp === undefined ? Math.random() < 0.5 : !r.lp;
      if (Math.random() < 0.25) positive = !positive;
      const T = shuffle(it.true), F = shuffle(it.false);
      const opts = positive
        ? [Object.assign({ ok:true }, T[0])].concat(F.slice(0,4).map(x => Object.assign({ ok:false }, x)))
        : T.slice(0,4).map(x => Object.assign({ ok:true }, x)).concat([Object.assign({ ok:false }, F[0])]);
      // 정답 = 옳은 것 문제면 참인 보기, 옳지 않은 것 문제면 거짓인 보기
      const shown = shuffle(opts).map(o => ({ text:o.t, note:o.n || '', truth:o.ok, correct: positive ? o.ok : !o.ok }));
      return { kind:'pool', q:`${it.topic}에 대한 설명으로 ${positive ? '옳은' : '옳지 않은'} 것은?`, opts:shown, positive, vi:null };
    }
    const n = it.variants.length;
    let vi = rnd(n);
    if (n > 1 && r.lv !== undefined && vi === r.lv) vi = (vi + 1 + rnd(n - 1)) % n;
    const v = it.variants[vi];
    const shown = shuffle(v.choices.map((t, i) => ({ text:t, correct: i === v.answer })));
    return { kind:'mcq', q:v.q, opts:shown, vi };
  }
  function newQuestion(){
    picked = null;
    const it = byId[list[idx]];
    inst = it ? makeInstance(it) : null;
  }

  function renderTally(){
    const ids = pool().map(q => q.id);
    let o = 0, x = 0;
    ids.forEach(id => { const s = status(id); if (s === 'o') o++; else if (s === 'x') x++; });
    tally.innerHTML = `<span class="o">맞힘 ${o}</span><span class="x">틀림 ${x}</span><span>안 풂 ${ids.length - o - x}</span>`;
  }
  function renderStrip(){
    strip.innerHTML = list.map((id, i) =>
      `<button class="cell ${status(id)} ${i === idx ? 'cur' : ''}" data-i="${i}" aria-label="${i + 1}번">${i + 1}</button>`
    ).join('');
    const many = list.length > 60;
    strip.classList.toggle('folded', many && !stripOpen);
    $('#stripToggle').hidden = !many;
    $('#stripToggle').textContent = stripOpen ? '접기' : '펼치기';
    $('#stripInfo').textContent = list.length ? `이번 세트 ${list.length}문제` : '';
    strip.hidden = list.length === 0;
  }
  $('#stripToggle').onclick = () => { stripOpen = !stripOpen; renderStrip(); };
  strip.addEventListener('click', e => {
    const b = e.target.closest('.cell'); if (!b) return;
    idx = +b.dataset.i; store.session.idx = idx; save(); newQuestion(); render();
  });

  function expHtml(it){
    const right = inst.opts.find(o => o.correct);
    let h = `<p class="ans">정답: ${esc(right.text)}</p>`;
    if (inst.kind === 'pool') {
      h += '<ul class="notes">' + inst.opts.map((o, d) =>
        `<li class="${o.truth ? 't' : 'f'}"><span class="mk">${NUM[d]} ${o.truth ? '맞는 설명' : '틀린 설명'}</span>${o.truth ? '' : ` <span class="why">${esc(o.note)}</span>`}${o.truth && o.note ? ` <span class="why">${esc(o.note)}</span>` : ''}</li>`
      ).join('') + '</ul>';
    }
    h += String(it.exp).split('\n').filter(Boolean).map(t => `<p>${esc(t)}</p>`).join('');
    h += `<p class="pg">출처: 자습서 ${it.page}쪽, ‘${esc(it.src)}’</p>`;
    return `<div class="exp">${h}</div>`;
  }

  function render(){
    renderTally(); renderStrip();
    const p = store.prefs;
    if (list.length === 0){
      const msg = p.mode === 'wrong' ? '틀린 문제가 없어요. 전체에서 먼저 풀어 보세요.'
                : p.mode === 'unseen' ? '고른 범위는 전부 한 번씩 풀었어요.'
                : '고른 범위에 문제가 없어요.';
      main.innerHTML = `<div class="card empty"><p>${msg}</p><button class="btn primary" id="toAll">전체 풀기</button></div>`;
      $('#toAll').onclick = () => { store.prefs.mode = 'all'; rebuild(true); };
      return;
    }
    if (idx >= list.length){
      let o = 0; list.forEach(id => { if (status(id) === 'o') o++; });
      const wrongLeft = list.filter(id => status(id) === 'x').length;
      main.innerHTML = `<div class="card summary">
        <div class="big">${o} / ${list.length}</div>
        <p>이번 세트에서 맞힌 문제 (찍음 표시한 것은 뺐어요)</p>
        <div class="row">
          ${wrongLeft ? `<button class="btn primary" id="redoWrong">틀린 ${wrongLeft}문제 다시 풀기</button>` : ''}
          <button class="btn" id="again">처음부터 다시</button>
        </div></div>`;
      const rw = $('#redoWrong'); if (rw) rw.onclick = () => { store.prefs.mode = 'wrong'; rebuild(true); };
      $('#again').onclick = () => rebuild(true);
      return;
    }
    const it = byId[list[idx]];
    const answered = picked !== null;
    const correct = answered && inst.opts[picked].correct;
    const r = store.records[it.id] || {};
    const guessed = answered && correct && r.guessNow;
    let verdict = '';
    if (answered) {
      if (guessed) verdict = `<p class="verdict x">찍음 — ‘틀린 것’에 넣어 뒀어요</p>`;
      else if (correct) verdict = `<p class="verdict o">정답 <button class="guess" id="guessBtn">찍어서 맞혔어요</button></p>`;
      else verdict = `<p class="verdict x">오답 — 정답은 ${NUM[inst.opts.findIndex(o => o.correct)]}</p>`;
    }
    main.innerHTML = `<article class="card">
      <p class="meta">${it.lecture}강 ${esc(LECTURE_META[it.lecture] || '')} — ${idx + 1} / ${list.length}</p>
      <p class="q">${esc(inst.q)}</p>
      <div class="choices">
        ${inst.opts.map((o, d) => {
          let cls = '';
          if (answered) cls = o.correct ? 'right' : (d === picked ? 'wrong' : 'dim');
          return `<button class="choice ${cls}" data-d="${d}" ${answered ? 'disabled' : ''}><span class="n">${NUM[d]}</span><span>${esc(o.text)}</span></button>`;
        }).join('')}
      </div>
      ${answered ? verdict + expHtml(it) : ''}
      <div class="nav">
        <button class="btn" id="prev" ${idx === 0 ? 'disabled' : ''}>이전</button>
        <button class="btn primary" id="next">${answered ? (idx === list.length - 1 ? '결과 보기' : '다음 문제') : '건너뛰기'}</button>
      </div>
    </article>`;
    main.querySelectorAll('.choice').forEach(b => b.onclick = () => choose(+b.dataset.d));
    const gb = $('#guessBtn'); if (gb) gb.onclick = markGuess;
    $('#prev').onclick = prev; $('#next').onclick = next;
  }

  function choose(d){
    if (picked !== null || !inst || d >= inst.opts.length) return;
    const it = byId[list[idx]];
    picked = d;
    const ok = inst.opts[d].correct;
    const r = store.records[it.id] || { tries:0, wrong:0 };
    r.tries++; if (!ok) r.wrong++; r.last = ok; r.ts = Date.now(); r.guessNow = false;
    if (inst.kind === 'pool') r.lp = inst.positive; else r.lv = inst.vi;
    store.records[it.id] = r;
    save(); render();
    const v = main.querySelector('.verdict');
    if (v && v.getBoundingClientRect().bottom > window.innerHeight) v.scrollIntoView({ behavior:'smooth', block:'center' });
  }
  function markGuess(){
    const it = byId[list[idx]];
    const r = store.records[it.id]; if (!r) return;
    r.last = false; r.guessNow = true; r.guess = (r.guess || 0) + 1;
    save(); render();
  }
  function next(){ if (idx >= list.length) return; idx++; store.session.idx = idx; save(); newQuestion(); render(); window.scrollTo({ top:0 }); }
  function prev(){ if (idx <= 0) return; idx--; store.session.idx = idx; save(); newQuestion(); render(); }

  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if ($('#moveDlg').open) return;
    if (/^[1-6]$/.test(e.key)) choose(+e.key - 1);
    else if (e.key === 'g' || e.key === 'G') { if ($('#guessBtn')) markGuess(); }
    else if (e.key === 'Enter' || e.key === 'ArrowRight') { if (document.activeElement && document.activeElement.classList.contains('cell')) return; e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft') prev();
  });

  $('#reset').onclick = () => {
    if (!confirm('푼 기록을 모두 지울까요?')) return;
    store.records = {}; store.session = null; save(); rebuild(true);
  };

  // 기록 옮기기
  const dlg = $('#moveDlg'), ta = $('#moveText');
  $('#exportBtn').onclick = () => { ta.value = JSON.stringify({ v:2, records: store.records }); dlg.showModal(); };
  $('#closeDlg').onclick = () => dlg.close();
  $('#copyBtn').onclick = async () => {
    ta.select();
    try { await navigator.clipboard.writeText(ta.value); } catch(e) { try { document.execCommand('copy'); } catch(_) {} }
    $('#copyBtn').textContent = '복사됨';
    setTimeout(() => $('#copyBtn').textContent = '복사', 1500);
  };
  $('#importBtn').onclick = () => {
    try {
      const data = JSON.parse(ta.value);
      if (!data || typeof data.records !== 'object') throw new Error();
      Object.entries(data.records).forEach(([id, r]) => {
        if (!byId[id]) return;
        const cur = store.records[id];
        if (!cur || (r.ts || 0) > (cur.ts || 0)) store.records[id] = r;
      });
      save(); dlg.close(); rebuild(true);
    } catch(e) { alert('붙여 넣은 글자를 읽을 수 없어요. ‘기록 옮기기’에서 복사한 글자 전체를 붙여 넣으세요.'); }
  };

  rebuild(false);
})();
</script>
</body>
</html>
