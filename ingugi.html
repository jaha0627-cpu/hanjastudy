<style>
:root{
  color-scheme: light;
  --paper:#fbf8fb; --surface:#ffffff; --ink:#221b2e; --muted:#6f667a; --line:#e6dfe8;
  --hema:#4a3d8f; --hema-soft:#ebe7f8; --on-hema:#ffffff;
  --eosin:#c8456f; --eosin-soft:#fbe4ec;
  --ok:#22795a; --ok-soft:#dcf1e6;
  --empty:#e9e4ec;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#16131b; --surface:#201c27; --ink:#ece8f2; --muted:#a59cb0; --line:#342e3d;
    --hema:#a99cf0; --hema-soft:#2c2645; --on-hema:#16131b;
    --eosin:#f07a9f; --eosin-soft:#3d2030;
    --ok:#5cc79a; --ok-soft:#183a2c;
    --empty:#332d3b;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#16131b; --surface:#201c27; --ink:#ece8f2; --muted:#a59cb0; --line:#342e3d;
  --hema:#a99cf0; --hema-soft:#2c2645; --on-hema:#16131b;
  --eosin:#f07a9f; --eosin-soft:#3d2030;
  --ok:#5cc79a; --ok-soft:#183a2c;
  --empty:#332d3b;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  font-size:17px; line-height:1.6; -webkit-text-size-adjust:100%; word-break:keep-all; overflow-wrap:anywhere;
}
.wrap{max-width:780px; margin:0 auto; padding:20px 18px 48px}
header{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap}
h1{font-size:1.5rem; font-weight:700; margin:0; letter-spacing:-0.01em}
.tally{font-size:.95rem; color:var(--muted); font-variant-numeric:tabular-nums; display:flex; gap:12px}
.tally .o{color:var(--ok); font-weight:600} .tally .x{color:var(--eosin); font-weight:600}

.controls{display:flex; flex-direction:column; gap:10px; margin:16px 0 14px}
.controls .line{display:flex; flex-wrap:wrap; gap:10px}
.seg{display:inline-flex; flex-wrap:wrap; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:3px; gap:2px}
.seg button{
  font:inherit; font-size:.9rem; border:0; background:transparent; color:var(--muted);
  padding:6px 12px; border-radius:7px; cursor:pointer; min-height:36px;
}
.seg button[aria-pressed="true"]{background:var(--hema); color:var(--on-hema); font-weight:600}
.seg button:disabled{opacity:.38; cursor:default}

.stripbar{display:flex; justify-content:space-between; align-items:center; margin:2px 0 6px; font-size:.85rem; color:var(--muted)}
.strip{display:grid; grid-template-columns:repeat(auto-fill,minmax(22px,1fr)); gap:5px; margin:0 0 22px}
.strip.folded{max-height:84px; overflow:hidden}
.cell{aspect-ratio:1; border:0; border-radius:50%; background:var(--empty); cursor:pointer; padding:0; font:inherit; font-size:0}
.cell.o{background:var(--ok)}
.cell.x{background:var(--eosin)}
.cell.cur{outline:2.5px solid var(--hema); outline-offset:2px}

.card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:22px 20px}
.meta{font-size:.88rem; color:var(--muted); margin:0 0 8px}
.q{font-size:1.14rem; font-weight:600; margin:0 0 18px; line-height:1.55}
.choices{display:grid; gap:9px}
.choice{
  font:inherit; text-align:left; display:flex; gap:12px; align-items:flex-start;
  background:transparent; color:var(--ink); border:1.5px solid var(--line); border-radius:12px;
  padding:12px 14px; cursor:pointer; min-height:48px; line-height:1.5;
}
.choice .n{flex:none; width:1.5em; color:var(--muted); font-weight:600}
.choice:hover:not(:disabled){border-color:var(--hema)}
.choice:disabled{cursor:default}
.choice.right{border-color:var(--ok); background:var(--ok-soft)}
.choice.right .n{color:var(--ok)}
.choice.wrong{border-color:var(--eosin); background:var(--eosin-soft)}
.choice.wrong .n{color:var(--eosin)}
.choice.dim{opacity:.55}

.verdict{margin:18px 0 6px; font-weight:700; font-size:1.05rem}
.verdict.o{color:var(--ok)} .verdict.x{color:var(--eosin)}
.exp{background:var(--hema-soft); border-radius:12px; padding:14px 16px; margin-top:8px; line-height:1.75}
.exp p{margin:0 0 8px}
.exp p:last-of-type{margin-bottom:4px}
.exp .ans{font-weight:700; margin-bottom:10px}
.exp .notes{list-style:none; margin:0 0 12px; padding:0; display:grid; gap:6px}
.exp .notes li{padding:8px 10px; border-radius:9px; background:var(--surface); line-height:1.6}
.exp .notes .mk{font-weight:600; margin-right:4px}
.exp .notes li.t .mk{color:var(--ok)}
.exp .notes li.f .mk{color:var(--eosin)}
.exp .notes .why{color:var(--ink)}
.exp .pg{font-size:.88rem; color:var(--hema); font-weight:600; margin:10px 0 0}
.guess{font:inherit; font-size:.85rem; font-weight:600; margin-left:10px; padding:5px 10px; border-radius:8px; border:1.5px solid var(--line); background:var(--surface); color:var(--muted); cursor:pointer; vertical-align:middle}


.nav{display:flex; justify-content:space-between; gap:10px; margin-top:18px}
.btn{
  font:inherit; font-size:.98rem; font-weight:600; border-radius:12px; padding:12px 18px; min-height:48px;
  cursor:pointer; border:1.5px solid var(--line); background:var(--surface); color:var(--ink);
}
.btn.primary{background:var(--hema); border-color:var(--hema); color:var(--on-hema)}
.btn:disabled{opacity:.4; cursor:default}

.empty, .summary{text-align:center; padding:34px 20px}
.summary .big{font-size:2.6rem; font-weight:700; font-variant-numeric:tabular-nums; margin:6px 0}
.summary p{color:var(--muted); margin:6px 0 20px}
.summary .row{display:flex; justify-content:center; gap:10px; flex-wrap:wrap}

footer{margin-top:28px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; font-size:.85rem; color:var(--muted)}
footer .tools{display:flex; gap:14px}
.link{font:inherit; font-size:.85rem; background:none; border:0; color:var(--muted); text-decoration:underline; cursor:pointer; padding:6px 0}

dialog{border:1px solid var(--line); border-radius:16px; background:var(--surface); color:var(--ink); padding:20px; width:min(92vw,520px)}
dialog::backdrop{background:rgba(20,15,30,.45)}
dialog h2{font-size:1.1rem; margin:0 0 8px}
dialog p{margin:0 0 12px; color:var(--muted); font-size:.92rem}
dialog textarea{width:100%; height:140px; font:inherit; font-size:.8rem; border:1px solid var(--line); border-radius:10px; padding:10px; background:var(--paper); color:var(--ink)}
dialog .row{display:flex; justify-content:flex-end; gap:8px; margin-top:12px; flex-wrap:wrap}

button:focus-visible{outline:2.5px solid var(--hema); outline-offset:2px}
@media (prefers-reduced-motion: no-preference){
  .exp,.verdict{animation:rise .18s ease-out}
  @keyframes rise{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}
}
@media (max-width:480px){
  .wrap{padding:16px 14px 40px}
  .card{padding:18px 15px}
  .q{font-size:1.06rem}
}

.view[hidden]{display:none}
.sec{margin:22px 0 0}
.sec h2{font-size:1rem; font-weight:700; margin:0 0 10px; display:flex; justify-content:space-between; align-items:baseline}
.sec h2 .link{font-weight:400}
.lec{display:grid; gap:8px}
.lecbtn{
  font:inherit; text-align:left; width:100%; display:grid; grid-template-columns:auto 1fr auto; gap:4px 12px; align-items:center;
  background:var(--surface); color:var(--ink); border:1.5px solid var(--line); border-radius:14px; padding:12px 14px; cursor:pointer;
}
.lecbtn .box{width:22px; height:22px; border-radius:7px; border:2px solid var(--line); grid-row:span 2; display:grid; place-items:center; font-size:.8rem; color:transparent}
.lecbtn[aria-pressed="true"]{border-color:var(--hema)}
.lecbtn[aria-pressed="true"] .box{background:var(--hema); border-color:var(--hema); color:var(--on-hema)}
.lecbtn .t{font-weight:600}
.lecbtn .c{font-size:.85rem; color:var(--muted); font-variant-numeric:tabular-nums}
.lecbtn .bar{grid-column:2 / 4; height:6px; border-radius:3px; background:var(--empty); overflow:hidden; display:flex}
.lecbtn .bar i{display:block; height:100%}
.lecbtn .bar .bo{background:var(--ok)} .lecbtn .bar .bx{background:var(--eosin)}
.lecbtn:disabled{opacity:.45; cursor:default}
.opts{display:flex; flex-wrap:wrap; gap:10px}
.note{font-size:.9rem; color:var(--muted); margin:16px 0 0; line-height:1.6}
.start{display:grid; gap:10px; margin-top:16px}
.btn.big{font-size:1.08rem; min-height:56px}
.qbar{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px}
.qbar .tally{font-size:.9rem}
</style>
</head>
<body>
<div class="wrap">

<section class="view" id="homeView">
  <header>
    <h1>인구기 문제</h1>
    <div class="tally" id="homeTally"></div>
  </header>

  <div class="sec">
    <h2>범위 <button class="link" id="selAll">전체 선택</button></h2>
    <div class="lec" id="lecList"></div>
  </div>

  <div class="sec">
    <h2>문제 수</h2>
    <div class="opts"><div class="seg" id="countSeg" role="group" aria-label="문제 수">
      <button data-v="30">30문제</button><button data-v="50">50문제</button><button data-v="100">100문제</button>
    </div></div>
  </div>

  <div class="sec">
    <h2>순서</h2>
    <div class="opts"><div class="seg" id="orderSeg" role="group" aria-label="순서">
      <button data-v="seq">단원 순서</button><button data-v="rand">랜덤 순서</button>
    </div></div>
  </div>

  <p class="note" id="planNote"></p>
  <div class="start">
    <button class="btn primary big" id="startBtn">퀴즈 시작</button>
    <button class="btn" id="wrongBtn"></button>
    <button class="btn" id="resumeBtn" hidden></button>
  </div>

  <footer>
    <span>고른 강에서 골고루 뽑고, 틀린 문제와 오래 안 본 문제를 먼저 내요. 같은 개념도 풀 때마다 묻는 방식이 바뀌어요.</span>
    <span class="tools">
      <button class="link" id="exportBtn">기록 옮기기</button>
      <button class="link" id="reset">기록 지우기</button>
    </span>
  </footer>
</section>

<section class="view" id="quizView" hidden>
  <div class="qbar">
    <button class="btn" id="homeBtn">← 홈</button>
    <div class="tally" id="tally"></div>
  </div>
  <div class="stripbar" id="stripbar"><span id="stripInfo"></span><button class="link" id="stripToggle" hidden>펼치기</button></div>
  <div class="strip" id="strip" aria-label="문항 목록"></div>
  <main id="main"></main>
  <footer><span>키보드: 1~5 선택, Enter 다음, G 찍음</span></footer>
</section>

</div>

<dialog id="moveDlg">
  <h2>기록 옮기기</h2>
  <p>다른 기기나 다른 주소에서 이어 풀 때 써요. 아래 글자를 복사해 두었다가, 옮길 곳에서 붙여 넣고 ‘가져오기’를 누르세요.</p>
  <textarea id="moveText" spellcheck="false"></textarea>
  <div class="row">
    <button class="btn" id="copyBtn">복사</button>
    <button class="btn" id="importBtn">가져오기</button>
    <button class="btn primary" id="closeDlg">닫기</button>
  </div>
</dialog>

      "소화 운동이 촉진된다.",
      "방광이 수축해 배뇨가 촉진된다.",
      "혈관이 확장되어 혈압이 떨어진다."
     ],
     "answer": 0
    },
    {
     "q": "식사 후 쉬면서 부교감신경이 우세할 때 일어나는 변화로 옳은 것은?",
     "choices": [
      "소화기가 수축해 연동이 촉진된다.",
      "기관지가 확장된다.",
      "혈관이 수축해 혈압이 오른다.",
      "방광이 이완되어 배뇨가 억제된다."
     ],
     "answer": 0
    },
    {
     "q": "민무늬근을 지배하는 부교감신경의 신경전달물질은?",
     "choices": [
      "acetylcholine",
      "norepinephrine",
      "histamine",
      "ANP"
     ],
     "answer": 0
    }
   ],
   "id": "L6-38"
  },
  {
   "kind": "mcq",
   "page": 143,
   "src": "근육 3종류 최종 비교",
   "exp": "칼슘 스위치: 뼈대근·심장근 = 트로포닌C(액틴 쪽 덮개 치우기) / 민무늬근 = 칼모듈린 → 미오신 가벼운사슬.\nT세관: 뼈대근 = 세동이(A-I 경계) / 심장근 = 두동이 / 민무늬근 = 없음(표면소포).\n세포 연결: 심장근 = 사이원반(부착띠·부착반점·틈새이음) / 민무늬근 = 틈새이음.\n조절: 뼈대근 = 체성신경(수의) / 심장근 = 자동능 + 자율신경 / 민무늬근 = 자율신경 + 호르몬.",
   "variants": [
    {
     "q": "칼슘이 오면 트로포닌 대신 미오신 가벼운사슬 쪽 스위치를 켜서 수축하는 근육은?",
     "choices": [
      "민무늬근",
      "뼈대근",
      "심장근",
      "모든 근육"
     ],
     "answer": 0
    },
    {
     "q": "가로세관이 없고 표면소포(caveolae)가 신호를 받는 근육은?",
     "choices": [
      "민무늬근",
      "뼈대근",
      "심장근",
      "해당 없음"
     ],
     "answer": 0
    },
    {
     "q": "두동이(diad)를 갖는 근육은?",
     "choices": [
      "심장근",
      "뼈대근",
      "민무늬근",
      "해당 없음"
     ],
     "answer": 0
    }
   ],
   "id": "L6-39"
  }
 ]
}
</script>

<script>
(function(){
  const LECTURE_META = {1:'세포학, 조직학 서론', 2:'발생학 서론', 3:'상피와 고유결합조직', 4:'연골과 뼈', 5:'혈액', 6:'근육조직'};
  const KEY = 'ingugi-quiz:v2';
  const NUM = ['①','②','③','④','⑤','⑥'];

  // ── 데이터 ──
  const blocks = [];
  document.querySelectorAll('script.quiz-data').forEach(el => {
    try { blocks.push(JSON.parse(el.textContent)); } catch(e) { console.error('데이터 블록 오류', e); }
  });
  const Q = [];
  blocks.sort((a,b) => a.lecture - b.lecture).forEach(b => {
    if (b.title) LECTURE_META[b.lecture] = b.title;
    b.items.forEach((it, i) => Q.push(Object.assign({ lecture:b.lecture, ord:i }, it)));
  });
  const byId = Object.fromEntries(Q.map(q => [q.id, q]));
  const available = [...new Set(Q.map(q => q.lecture))];

  // ── 저장 ──
  let store = { records:{}, session:null, prefs:{ lectures:available.slice(), count:50, order:'seq' } };
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const s = JSON.parse(raw);
      store.records = s.records || {};
      store.session = s.session && Array.isArray(s.session.list) && s.session.results ? s.session : null;
      if (s.prefs) {
        if (Array.isArray(s.prefs.lectures)) store.prefs.lectures = s.prefs.lectures;
        if ([30,50,100].includes(+s.prefs.count)) store.prefs.count = +s.prefs.count;
        if (s.prefs.order === 'seq' || s.prefs.order === 'rand') store.prefs.order = s.prefs.order;
      }
    }
  } catch(e) {}
  store.prefs.lectures = store.prefs.lectures.filter(n => available.includes(n));
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e) {} }

  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const $ = s => document.querySelector(s);
  const rnd = n => Math.floor(Math.random() * n);
  function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function status(id){ const r = store.records[id]; return r ? (r.last ? 'o' : 'x') : ''; }
  const itemsOf = L => Q.filter(q => L.includes(q.lecture));

  // ── 홈 화면 ──
  function showView(v){
    $('#homeView').hidden = v !== 'home';
    $('#quizView').hidden = v !== 'quiz';
    window.scrollTo({ top:0 });
    if (v === 'home') renderHome();
  }

  function renderHome(){
    const all = Q.map(q => q.id);
    let o = 0, x = 0; all.forEach(id => { const s = status(id); if (s === 'o') o++; else if (s === 'x') x++; });
    $('#homeTally').innerHTML = `<span class="o">맞힘 ${o}</span><span class="x">틀림 ${x}</span><span>안 풂 ${all.length - o - x}</span>`;

    const sel = store.prefs.lectures;
    $('#lecList').innerHTML = Object.keys(LECTURE_META).map(Number).sort((a,b)=>a-b).map(n => {
      const items = Q.filter(q => q.lecture === n);
      const has = items.length > 0;
      let lo = 0, lx = 0; items.forEach(q => { const s = status(q.id); if (s === 'o') lo++; else if (s === 'x') lx++; });
      const tot = items.length || 1;
      return `<button class="lecbtn" data-n="${n}" aria-pressed="${sel.includes(n)}" ${has ? '' : 'disabled'}>
        <span class="box">✓</span>
        <span class="t">${n}강 ${esc(LECTURE_META[n])}</span>
        <span class="c">${has ? `${lo} / ${items.length}` : '준비 중'}</span>
        ${has ? `<span class="bar"><i class="bo" style="width:${lo/tot*100}%"></i><i class="bx" style="width:${lx/tot*100}%"></i></span>` : ''}
      </button>`;
    }).join('');
    $('#selAll').textContent = sel.length === available.length ? '전체 해제' : '전체 선택';

    document.querySelectorAll('#countSeg button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.v === store.prefs.count)));
    document.querySelectorAll('#orderSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === store.prefs.order)));

    const pool = itemsOf(sel);
    const n = Math.min(store.prefs.count, pool.length);
    const wrong = pool.filter(q => status(q.id) === 'x').length;
    const unseen = pool.filter(q => !store.records[q.id]).length;
    $('#planNote').textContent = sel.length === 0 ? '범위를 하나 이상 골라 주세요.'
      : `${sel.map(k => k + '강').join(', ')}에서 ${n}문제를 골고루 뽑아요.` + (pool.length < store.prefs.count ? ` (고른 범위의 개념이 ${pool.length}개라 ${n}문제로 맞췄어요.)` : '') + (wrong ? ` 틀린 문제 ${wrong}개가 우선으로 나와요.` : (unseen && unseen < pool.length ? ` 아직 안 푼 문제 ${unseen}개가 우선으로 나와요.` : ''));
    $('#startBtn').disabled = sel.length === 0;
    $('#wrongBtn').textContent = `틀린 문제만 풀기 (${wrong}개)`;
    $('#wrongBtn').disabled = wrong === 0;

    const s = store.session;
    const left = s ? s.list.length - Object.keys(s.results).length : 0;
    $('#resumeBtn').hidden = !(s && left > 0);
    if (s && left > 0) $('#resumeBtn').textContent = `이어 풀기 (${Object.keys(s.results).length} / ${s.list.length} 풀었음)`;
  }

  $('#lecList').addEventListener('click', e => {
    const b = e.target.closest('.lecbtn'); if (!b || b.disabled) return;
    const n = +b.dataset.n; let L = store.prefs.lectures.slice();
    L = L.includes(n) ? L.filter(x => x !== n) : L.concat(n).sort((a,b)=>a-b);
    store.prefs.lectures = L; save(); renderHome();
  });
  $('#selAll').onclick = () => {
    store.prefs.lectures = store.prefs.lectures.length === available.length ? [] : available.slice();
    save(); renderHome();
  };
  $('#countSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; store.prefs.count = +b.dataset.v; save(); renderHome(); });
  $('#orderSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; store.prefs.order = b.dataset.v; save(); renderHome(); });

  // ── 문제 뽑기: 강별 균등 + 가중치 ──
  function weight(id){
    const r = store.records[id];
    if (!r) return 2;                                   // 안 푼 문제
    const days = Math.min(7, (Date.now() - (r.ts || 0)) / 86400000);
    if (r.last === false) return 6 + Math.min(r.wrong || 1, 4) + days * 0.3;   // 틀린·찍은 문제
    const streak = r.streak || 1;
    return Math.max(0.2, 1.2 * Math.pow(0.6, streak - 1)) * (1 + days * 0.15); // 맞힌 문제: 연속 정답일수록 낮게, 오래될수록 다시 높게
  }
  function weightedPick(items, k){
    return items.map(q => ({ q, key: Math.pow(Math.random(), 1 / weight(q.id)) }))
      .sort((a,b) => b.key - a.key).slice(0, k).map(x => x.q);
  }
  function pickSet(L, N){
    const groups = L.map(n => Q.filter(q => q.lecture === n)).filter(g => g.length);
    const total = groups.reduce((s,g) => s + g.length, 0);
    N = Math.min(N, total);
    const quota = groups.map(() => 0);
    let left = N, open = groups.map((g,i) => i);
    while (left > 0 && open.length) {
      const share = Math.max(1, Math.floor(left / open.length));
      const next = [];
      for (const i of open) {
        if (left <= 0) break;
        const add = Math.min(share, groups[i].length - quota[i], left);
        quota[i] += add; left -= add;
        if (quota[i] < groups[i].length) next.push(i);
      }
      open = next;
    }
    let chosen = [];
    groups.forEach((g, i) => { chosen = chosen.concat(weightedPick(g, quota[i])); });
    return chosen;
  }
  function orderSet(items){
    return store.prefs.order === 'rand' ? shuffle(items) : items.slice().sort((a,b) => a.lecture - b.lecture || a.ord - b.ord);
  }
  function startSession(items, label){
    store.session = { list: orderSet(items).map(q => q.id), idx:0, results:{}, label };
    save(); stripOpen = false; newQuestion(); showView('quiz'); render();
  }
  $('#startBtn').onclick = () => startSession(pickSet(store.prefs.lectures, store.prefs.count), 'normal');
  $('#wrongBtn').onclick = () => startSession(itemsOf(store.prefs.lectures).filter(q => status(q.id) === 'x'), 'wrong');
  $('#resumeBtn').onclick = () => { newQuestion(); showView('quiz'); render(); };
  $('#homeBtn').onclick = () => showView('home');

  // ── 퀴즈 화면 ──
  let inst = null, picked = null, stripOpen = false;
  const S = () => store.session;

  function makeInstance(it){
    const r = store.records[it.id] || {};
    if (it.kind === 'pool') {
      let positive = r.lp === undefined ? Math.random() < 0.5 : !r.lp;
      if (Math.random() < 0.25) positive = !positive;
      const T = shuffle(it.true), F = shuffle(it.false);
      const opts = positive
        ? [Object.assign({ ok:true }, T[0])].concat(F.slice(0,4).map(x => Object.assign({ ok:false }, x)))
        : T.slice(0,4).map(x => Object.assign({ ok:true }, x)).concat([Object.assign({ ok:false }, F[0])]);
      const shown = shuffle(opts).map(o => ({ text:o.t, note:o.n || '', truth:o.ok, correct: positive ? o.ok : !o.ok }));
      return { kind:'pool', q:`${it.topic}에 대한 설명으로 ${positive ? '옳은' : '옳지 않은'} 것은?`, opts:shown, positive, vi:null };
    }
    const n = it.variants.length;
    let vi = rnd(n);
    if (n > 1 && r.lv !== undefined && vi === r.lv) vi = (vi + 1 + rnd(n - 1)) % n;
    const v = it.variants[vi];
    return { kind:'mcq', q:v.q, opts:shuffle(v.choices.map((t, i) => ({ text:t, correct: i === v.answer }))), vi };
  }
  function newQuestion(){
    picked = null;
    const s = S(); const it = s && byId[s.list[s.idx]];
    inst = it ? makeInstance(it) : null;
  }

  function renderStrip(){
    const s = S(), strip = $('#strip');
    strip.innerHTML = s.list.map((id, i) =>
      `<button class="cell ${s.results[id] || ''} ${i === s.idx ? 'cur' : ''}" data-i="${i}" aria-label="${i + 1}번">${i + 1}</button>`
    ).join('');
    const many = s.list.length > 60;
    strip.classList.toggle('folded', many && !stripOpen);
    $('#stripToggle').hidden = !many;
    $('#stripToggle').textContent = stripOpen ? '접기' : '펼치기';
    $('#stripInfo').textContent = s.label === 'wrong' ? `틀린 문제 ${s.list.length}개` : `이번 세트 ${s.list.length}문제`;
    let o = 0, x = 0; Object.values(s.results).forEach(v => { if (v === 'o') o++; else x++; });
    $('#tally').innerHTML = `<span class="o">맞힘 ${o}</span><span class="x">틀림 ${x}</span><span>남음 ${s.list.length - o - x}</span>`;
  }
  $('#stripToggle').onclick = () => { stripOpen = !stripOpen; renderStrip(); };
  $('#strip').addEventListener('click', e => {
    const b = e.target.closest('.cell'); if (!b) return;
    S().idx = +b.dataset.i; save(); newQuestion(); render();
  });

  function expHtml(it){
    const right = inst.opts.find(o => o.correct);
    let h = `<p class="ans">정답: ${esc(right.text)}</p>`;
    if (inst.kind === 'pool') {
      h += '<ul class="notes">' + inst.opts.map((o, d) =>
        `<li class="${o.truth ? 't' : 'f'}"><span class="mk">${NUM[d]} ${o.truth ? '맞는 설명' : '틀린 설명'}</span>${o.note ? ` <span class="why">${esc(o.note)}</span>` : ''}</li>`
      ).join('') + '</ul>';
    }
    h += String(it.exp).split('\n').filter(Boolean).map(t => `<p>${esc(t)}</p>`).join('');
    h += `<p class="pg">출처: 자습서 ${it.page}쪽, ‘${esc(it.src)}’</p>`;
    return `<div class="exp">${h}</div>`;
  }

  function render(){
    const s = S(), main = $('#main');
    if (!s) { showView('home'); return; }
    renderStrip();
    if (s.list.length === 0){
      main.innerHTML = `<div class="card empty"><p>풀 문제가 없어요.</p><button class="btn primary" id="toHome">홈으로</button></div>`;
      $('#toHome').onclick = () => showView('home');
      return;
    }
    if (s.idx >= s.list.length){
      const done = Object.keys(s.results).length;
      const o = Object.values(s.results).filter(v => v === 'o').length;
      const wrongIds = s.list.filter(id => s.results[id] === 'x');
      const skipped = s.list.length - done;
      main.innerHTML = `<div class="card summary">
        <div class="big">${o} / ${s.list.length}</div>
        <p>맞힌 문제 (찍음 표시한 것은 틀린 것으로 셌어요)${skipped ? ` · 건너뛴 문제 ${skipped}개` : ''}</p>
        <div class="row">
          ${wrongIds.length ? `<button class="btn primary" id="redoWrong">이번에 틀린 ${wrongIds.length}문제 다시 풀기</button>` : ''}
          <button class="btn" id="again">같은 설정으로 새로 뽑기</button>
          <button class="btn" id="toHome">홈으로</button>
        </div></div>`;
      const rw = $('#redoWrong'); if (rw) rw.onclick = () => startSession(wrongIds.map(id => byId[id]), 'wrong');
      $('#again').onclick = () => startSession(pickSet(store.prefs.lectures, store.prefs.count), 'normal');
      $('#toHome').onclick = () => showView('home');
      return;
    }
    const it = byId[s.list[s.idx]];
    const answered = picked !== null;
    const correct = answered && inst.opts[picked].correct;
    const r = store.records[it.id] || {};
    let verdict = '';
    if (answered) {
      if (correct && r.guessNow) verdict = `<p class="verdict x">찍음 — 틀린 문제로 넣어 뒀어요</p>`;
      else if (correct) verdict = `<p class="verdict o">정답 <button class="guess" id="guessBtn">찍어서 맞혔어요</button></p>`;
      else verdict = `<p class="verdict x">오답 — 정답은 ${NUM[inst.opts.findIndex(o => o.correct)]}</p>`;
    }
    main.innerHTML = `<article class="card">
      <p class="meta">${it.lecture}강 ${esc(LECTURE_META[it.lecture] || '')} — ${s.idx + 1} / ${s.list.length}</p>
      <p class="q">${esc(inst.q)}</p>
      <div class="choices">
        ${inst.opts.map((o, d) => {
          let cls = '';
          if (answered) cls = o.correct ? 'right' : (d === picked ? 'wrong' : 'dim');
          return `<button class="choice ${cls}" data-d="${d}" ${answered ? 'disabled' : ''}><span class="n">${NUM[d]}</span><span>${esc(o.text)}</span></button>`;
        }).join('')}
      </div>
      ${answered ? verdict + expHtml(it) : ''}
      <div class="nav">
        <button class="btn" id="prev" ${s.idx === 0 ? 'disabled' : ''}>이전</button>
        <button class="btn primary" id="next">${answered ? (s.idx === s.list.length - 1 ? '결과 보기' : '다음 문제') : '건너뛰기'}</button>
      </div>
    </article>`;
    main.querySelectorAll('.choice').forEach(b => b.onclick = () => choose(+b.dataset.d));
    const gb = $('#guessBtn'); if (gb) gb.onclick = markGuess;
    $('#prev').onclick = prev; $('#next').onclick = next;
  }

  function choose(d){
    if (picked !== null || !inst || d >= inst.opts.length) return;
    const s = S(), it = byId[s.list[s.idx]];
    picked = d;
    const ok = inst.opts[d].correct;
    const r = store.records[it.id] || { tries:0, wrong:0 };
    r.tries++; r.last = ok; r.ts = Date.now(); r.guessNow = false;
    if (ok) r.streak = (r.streak || 0) + 1; else { r.wrong = (r.wrong || 0) + 1; r.streak = 0; }
    if (inst.kind === 'pool') r.lp = inst.positive; else r.lv = inst.vi;
    store.records[it.id] = r;
    s.results[it.id] = ok ? 'o' : 'x';
    save(); render();
    const v = $('#main .verdict');
    if (v && v.getBoundingClientRect().bottom > window.innerHeight) v.scrollIntoView({ behavior:'smooth', block:'center' });
  }
  function markGuess(){
    const s = S(), it = byId[s.list[s.idx]];
    const r = store.records[it.id]; if (!r) return;
    r.last = false; r.guessNow = true; r.streak = 0; r.wrong = (r.wrong || 0) + 1; r.guess = (r.guess || 0) + 1;
    s.results[it.id] = 'x';
    save(); render();
  }
  function next(){ const s = S(); if (s.idx >= s.list.length) return; s.idx++; save(); newQuestion(); render(); window.scrollTo({ top:0 }); }
  function prev(){ const s = S(); if (s.idx <= 0) return; s.idx--; save(); newQuestion(); render(); }

  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if ($('#moveDlg').open || $('#quizView').hidden) return;
    if (/^[1-6]$/.test(e.key)) choose(+e.key - 1);
    else if (e.key === 'g' || e.key === 'G') { if ($('#guessBtn')) markGuess(); }
    else if (e.key === 'Enter' || e.key === 'ArrowRight') { if (document.activeElement && document.activeElement.classList.contains('cell')) return; e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft') prev();
  });

  // ── 기록 관리 ──
  $('#reset').onclick = () => {
    if (!confirm('푼 기록을 모두 지울까요?')) return;
    store.records = {}; store.session = null; save(); renderHome();
  };
  const dlg = $('#moveDlg'), ta = $('#moveText');
  $('#exportBtn').onclick = () => { ta.value = JSON.stringify({ v:2, records: store.records }); dlg.showModal(); };
  $('#closeDlg').onclick = () => dlg.close();
  $('#copyBtn').onclick = async () => {
    ta.select();
    try { await navigator.clipboard.writeText(ta.value); } catch(e) { try { document.execCommand('copy'); } catch(_) {} }
    $('#copyBtn').textContent = '복사됨';
    setTimeout(() => $('#copyBtn').textContent = '복사', 1500);
  };
  $('#importBtn').onclick = () => {
    try {
      const data = JSON.parse(ta.value);
      if (!data || typeof data.records !== 'object') throw new Error();
      Object.entries(data.records).forEach(([id, r]) => {
        if (!byId[id]) return;
        const cur = store.records[id];
        if (!cur || (r.ts || 0) > (cur.ts || 0)) store.records[id] = r;
      });
      save(); dlg.close(); renderHome();
    } catch(e) { alert('붙여 넣은 글자를 읽을 수 없어요. ‘기록 옮기기’에서 복사한 글자 전체를 붙여 넣으세요.'); }
  };

  showView('home');
})();

</script>
</body>
</html>
